<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carpool schedule</title>
<style>
  :root {
    --paper: #F7F3EA; --paper-dark: #EFE8D8; --ink: #2B2A28; --ink-soft: #6B6459;
    --line: #D9D0BC; --card: #FFFFFF;
    --fam1: #8E5B6E; --fam1-bg: #F1E3E8;
    --fam2: #35706B; --fam2-bg: #E1EEEC;
    --fam3: #A9762C; --fam3-bg: #F3E7D2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1E1C18; --paper-dark: #262420; --ink: #EEE8DC; --ink-soft: #A79E8D;
      --line: #3A362E; --card: #26241F;
      --fam1: #C58AA0; --fam1-bg: #3A2830;
      --fam2: #6FB3AC; --fam2-bg: #21332F;
      --fam3: #D9A24F; --fam3-bg: #372C18;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 30px; margin: 0 0 4px; }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 22px; }

  .families { display: flex; gap: 10px; margin-bottom: 26px; flex-wrap: wrap; }
  .fam-chip { display: flex; align-items: center; gap: 8px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .fam-dot { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }
  .fam-chip input { border: none; border-bottom: 1.5px dashed var(--line); background: none;
    font-size: 15px; width: 120px; color: var(--ink); font-family: inherit; padding: 2px 0; }
  .fam-chip input:focus { outline: none; border-bottom-style: solid; border-bottom-color: var(--ink); }

  .day { margin-bottom: 16px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; }
  .day-label { font-family: Georgia, serif; font-size: 17px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--paper-dark); }
  .slots { display: grid; grid-template-columns: 1fr 1fr; }
  .slot { padding: 12px 14px; border-right: 1px solid var(--line); min-width: 0; }
  .slot:last-child { border-right: none; }
  .slot-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; }
  .tag { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 999px; margin-bottom: 8px; }
  .tag.empty { background: var(--paper-dark); color: var(--ink-soft); }
  .assign-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .assign-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; padding: 0; }
  .assign-btn.selected { border-color: var(--ink); box-shadow: 0 0 0 2px var(--card) inset; }
  .assign-btn:focus-visible, .note:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .note { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px;
    font-size: 14px; font-family: inherit; color: var(--ink); background: var(--paper); }
  .note::placeholder { color: var(--ink-soft); opacity: .6; }

  .banner { background: var(--paper-dark); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-size: 14px; margin-bottom: 22px; }
  .banner code { word-break: break-all; }
  .banner button { margin-top: 8px; font: inherit; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .status { text-align: center; color: var(--ink-soft); font-size: 12px; margin-top: 28px; }
  @media (max-width: 460px) { .slots { grid-template-columns: 1fr; }
    .slot { border-right: none; border-bottom: 1px solid var(--line); }
    .slot:last-child { border-bottom: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Carpool schedule</h1>
  <p class="sub">Tap a colored dot to claim a drop-off or pickup. Tap it again to release it.</p>
  <div class="banner" id="banner" hidden></div>
  <div class="families" id="families"></div>
  <div id="days"></div>
  <p class="status" id="status">Loading…</p>
</div>

<script>
// ===== CONFIG =====
// Paste your Firebase Realtime Database URL here, e.g.
// "https://my-carpool-default-rtdb.europe-west1.firebasedatabase.app"
const DATABASE_URL = "https://carpool-coordinator-2-default-rtdb.firebaseio.com";
// Week layout (Israeli school week). Edit freely.
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"];
const POLL_MS = 4000;
// ==================

const FAM_IDS = ["f1", "f2", "f3"];
const SLOT_TYPES = [{ key: "am", label: "Morning drop-off" }, { key: "pm", label: "Afternoon pickup" }];

// The schedule's "room" lives in the URL hash, so no secret is stored in the repo.
let room = location.hash.slice(1);
const isNewRoom = !room;
if (!room) {
  room = Array.from(crypto.getRandomValues(new Uint8Array(10)), b => (b % 36).toString(36)).join("");
  history.replaceState(null, "", "#" + room);
}

const base = DATABASE_URL.replace(/\/$/, "") + "/carpool/" + room;
let state = { families: {}, slots: {} };
let renderPending = false;

const famName = (id, i) => state.families[id] || ("Family " + (i + 1));

async function api(path, method, body) {
  const res = await fetch(base + path + ".json", {
    method: method || "GET",
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function setStatus(t) { document.getElementById("status").textContent = t; }

function render() {
  const ae = document.activeElement;
  if (ae && ae.tagName === "INPUT") { renderPending = true; return; }
  renderPending = false;

  const famDiv = document.getElementById("families");
  famDiv.innerHTML = "";
  FAM_IDS.forEach((id, i) => {
    const chip = document.createElement("div");
    chip.className = "fam-chip";
    chip.innerHTML = '<div class="fam-dot" style="background:var(--fam' + (i + 1) + ')"></div>';
    const input = document.createElement("input");
    input.value = famName(id, i);
    input.maxLength = 20;
    input.setAttribute("aria-label", "Family " + (i + 1) + " name");
    let t;
    const commit = () => {
      const v = input.value.trim() || ("Family " + (i + 1));
      state.families[id] = v;
      api("/families/" + id, "PUT", v).catch(() => setStatus("Couldn't save — check your connection."));
    };
    input.addEventListener("input", () => { clearTimeout(t); t = setTimeout(commit, 500); });
    input.addEventListener("blur", () => { clearTimeout(t); commit(); render(); });
    input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
    chip.appendChild(input);
    famDiv.appendChild(chip);
  });

  const daysDiv = document.getElementById("days");
  daysDiv.innerHTML = "";
  DAYS.forEach(day => {
    const dayEl = document.createElement("div");
    dayEl.className = "day";
    dayEl.innerHTML = '<div class="day-label">' + day + '</div>';
    const slotsEl = document.createElement("div");
    slotsEl.className = "slots";

    SLOT_TYPES.forEach(t => {
      const key = day + "_" + t.key;
      const slot = state.slots[key] || {};
      const slotEl = document.createElement("div");
      slotEl.className = "slot";

      const label = document.createElement("div");
      label.className = "slot-label";
      label.textContent = t.label;
      slotEl.appendChild(label);

      const tag = document.createElement("div");
      const idx = FAM_IDS.indexOf(slot.f);
      if (idx >= 0) {
        tag.className = "tag";
        tag.style.background = "var(--fam" + (idx + 1) + "-bg)";
        tag.style.color = "var(--fam" + (idx + 1) + ")";
        tag.textContent = famName(slot.f, idx);
      } else {
        tag.className = "tag empty";
        tag.textContent = "Nobody yet";
      }
      slotEl.appendChild(tag);

      const row = document.createElement("div");
      row.className = "assign-row";
      FAM_IDS.forEach((id, i) => {
        const b = document.createElement("button");
        b.className = "assign-btn" + (slot.f === id ? " selected" : "");
        b.style.background = "var(--fam" + (i + 1) + ")";
        b.setAttribute("aria-label", famName(id, i));
        b.setAttribute("aria-pressed", slot.f === id);
        b.addEventListener("click", () => setSlot(key, { f: slot.f === id ? null : id }));
        row.appendChild(b);
      });
      slotEl.appendChild(row);

      const note = document.createElement("input");
      note.className = "note";
      note.placeholder = "Time, address, notes";
      note.value = slot.n || "";
      note.maxLength = 120;
      note.addEventListener("blur", () => {
        const v = note.value.trim() || null;
        if (v !== (slot.n || null)) setSlot(key, { n: v });
        else if (renderPending) render();
      });
      note.addEventListener("keydown", e => { if (e.key === "Enter") note.blur(); });
      slotEl.appendChild(note);

      slotsEl.appendChild(slotEl);
    });
    dayEl.appendChild(slotsEl);
    daysDiv.appendChild(dayEl);
  });
}

function setSlot(key, patch) {
  const next = Object.assign({}, state.slots[key] || {}, patch);
  Object.keys(next).forEach(k => next[k] == null && delete next[k]);
  state.slots[key] = next;
  render();
  api("/slots/" + key, "PATCH", patch).catch(() => setStatus("Couldn't save — check your connection."));
}

async function poll() {
  try {
    const data = (await api("")) || {};
    state.families = data.families || {};
    state.slots = data.slots || {};
    setStatus("Live — everyone with this link sees the same schedule.");
    render();
  } catch (e) {
    setStatus("Can't reach the database. Check DATABASE_URL and your Firebase rules.");
  }
}

function showBanner() {
  const b = document.getElementById("banner");
  b.hidden = false;
  b.innerHTML = "<strong>Share this exact link</strong> with the other families. The part after # is what connects you to the same schedule.<br><code>" +
    location.href + "</code><br><button id='copy'>Copy link</button>";
  document.getElementById("copy").onclick = () => {
    navigator.clipboard.writeText(location.href).then(() => { document.getElementById("copy").textContent = "Copied"; });
  };
}

document.addEventListener("focusout", () => setTimeout(() => { if (renderPending) render(); }, 0));

render();
if (!DATABASE_URL) {
  setStatus("Setup needed: add your Firebase URL to DATABASE_URL at the top of this file's script.");
} else {
  if (isNewRoom) showBanner();
  poll();
  setInterval(poll, POLL_MS);
}
</script>
</body>
</html>
