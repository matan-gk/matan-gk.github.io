<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carpool schedule</title>
<style>
  :root {
    --paper: #F7F3EA; --paper-dark: #EFE8D8; --ink: #2B2A28; --ink-soft: #6B6459;
    --line: #D9D0BC; --card: #FFFFFF;
    --fam1: #8E5B6E; --fam1-bg: #F1E3E8;
    --fam2: #35706B; --fam2-bg: #E1EEEC;
    --fam3: #A9762C; --fam3-bg: #F3E7D2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1E1C18; --paper-dark: #262420; --ink: #EEE8DC; --ink-soft: #A79E8D;
      --line: #3A362E; --card: #26241F;
      --fam1: #C58AA0; --fam1-bg: #3A2830;
      --fam2: #6FB3AC; --fam2-bg: #21332F;
      --fam3: #D9A24F; --fam3-bg: #372C18;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 30px; margin: 0 0 4px; }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 22px; }
  h2.section { font-family: Georgia, serif; font-weight: 400; font-size: 18px; margin: 0 0 10px; }

  .families { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
  .fam-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .fam-top { display: flex; align-items: center; gap: 8px; }
  .fam-dot { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }
  .fam-top input.fam-name { border: none; border-bottom: 1.5px dashed var(--line); background: none;
    font-size: 15px; font-weight: 600; flex: 1; min-width: 0; color: var(--ink); font-family: inherit; padding: 2px 0; }
  .fam-top input.fam-name:focus { outline: none; border-bottom-style: solid; border-bottom-color: var(--ink); }
  .fam-instructions-label { font-size: 11px; color: var(--ink-soft); margin: 8px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  textarea.fam-instructions { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px;
    font-size: 14px; font-family: inherit; color: var(--ink); background: var(--paper); resize: vertical;
    min-height: 38px; }
  textarea.fam-instructions::placeholder { color: var(--ink-soft); opacity: .6; }

  .day { margin-bottom: 16px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; }
  .day-label { font-family: Georgia, serif; font-size: 17px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--paper-dark); }
  .slots { display: grid; grid-template-columns: 1fr 1fr; }
  .slot { padding: 12px 14px; border-right: 1px solid var(--line); min-width: 0; }
  .slot:last-child { border-right: none; }
  .slot-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; }
  .tag { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 999px; margin-bottom: 8px; }
  .tag.empty { background: var(--paper-dark); color: var(--ink-soft); }
  .assign-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .assign-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; padding: 0; flex-shrink: 0; }
  .assign-btn.selected { border-color: var(--ink); box-shadow: 0 0 0 2px var(--card) inset; }
  .assign-btn:focus-visible, .note:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .assigned-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .assigned-name { font-family: Georgia, serif; font-size: 17px; color: var(--ink); line-height: 1.2; }
  .change-btn { font: inherit; font-size: 11px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); cursor: pointer;
    flex-shrink: 0; margin-left: auto; }
  .note-label { font-size: 11px; color: var(--ink-soft); margin: 2px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .note { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px;
    font-size: 14px; font-family: inherit; color: var(--ink); background: var(--paper); }
  .note::placeholder { color: var(--ink-soft); opacity: .6; }

  .banner { background: var(--paper-dark); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-size: 14px; margin-bottom: 22px; }
  .banner code { word-break: break-all; }
  .banner button { margin-top: 8px; font: inherit; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .status { text-align: center; color: var(--ink-soft); font-size: 12px; margin-top: 28px; }
  @media (max-width: 460px) { .slots { grid-template-columns: 1fr; }
    .slot { border-right: none; border-bottom: 1px solid var(--line); }
    .slot:last-child { border-bottom: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Carpool schedule</h1>
  <p class="sub">Tap a colored dot to claim a drop-off or pickup. Everyone with the link sees updates right away.</p>
  <div class="banner" id="banner" hidden></div>

  <h2 class="section">Families</h2>
  <div class="families" id="families"></div>

  <div id="days"></div>
  <p class="status" id="status">Loading…</p>
</div>

<script>
// ===== CONFIG =====
const DATABASE_URL = "https://carpool-coordinator-2-default-rtdb.firebaseio.com";
// Week layout (Israeli school week). Edit freely.
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"];
const POLL_MS = 4000;
// ==================

const FAM_IDS = ["f1", "f2", "f3"];
const SLOT_TYPES = [{ key: "am", label: "Morning drop-off" }, { key: "pm", label: "Afternoon pickup" }];

// The schedule's "room" lives in the URL hash, so no secret is stored in the repo.
let room = location.hash.slice(1);
const isNewRoom = !room;
if (!room) {
  room = Array.from(crypto.getRandomValues(new Uint8Array(10)), b => (b % 36).toString(36)).join("");
  history.replaceState(null, "", "#" + room);
}

const base = DATABASE_URL.replace(/\/$/, "") + "/carpool/" + room;
// state.families[id] = { name, instructions }
let state = { families: {}, slots: {} };
let renderPending = false;

function famInfo(id, i) {
  const f = state.families[id] || {};
  return { name: f.name || ("Family " + (i + 1)), instructions: f.instructions || "" };
}

async function api(path, method, body) {
  const res = await fetch(base + path + ".json", {
    method: method || "GET",
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function setStatus(t) { document.getElementById("status").textContent = t; }

function render() {
  const ae = document.activeElement;
  if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) { renderPending = true; return; }
  renderPending = false;

  const famDiv = document.getElementById("families");
  famDiv.innerHTML = "";
  FAM_IDS.forEach((id, i) => {
    const info = famInfo(id, i);
    const card = document.createElement("div");
    card.className = "fam-card";

    const top = document.createElement("div");
    top.className = "fam-top";
    top.innerHTML = '<div class="fam-dot" style="background:var(--fam' + (i + 1) + ')"></div>';

    const nameInput = document.createElement("input");
    nameInput.className = "fam-name";
    nameInput.value = info.name;
    nameInput.maxLength = 20;
    nameInput.setAttribute("aria-label", "Family " + (i + 1) + " name");
    let nameTimer;
    const commitName = () => {
      const v = nameInput.value.trim() || ("Family " + (i + 1));
      state.families[id] = Object.assign({}, state.families[id], { name: v });
      api("/families/" + id + "/name", "PUT", v).catch(() => setStatus("Couldn't save — check your connection."));
    };
    nameInput.addEventListener("input", () => { clearTimeout(nameTimer); nameTimer = setTimeout(commitName, 500); });
    nameInput.addEventListener("blur", () => { clearTimeout(nameTimer); commitName(); render(); });
    nameInput.addEventListener("keydown", e => { if (e.key === "Enter") nameInput.blur(); });
    top.appendChild(nameInput);
    card.appendChild(top);

    const instrLabel = document.createElement("div");
    instrLabel.className = "fam-instructions-label";
    instrLabel.textContent = "Standing instructions";
    card.appendChild(instrLabel);

    const instrInput = document.createElement("textarea");
    instrInput.className = "fam-instructions";
    instrInput.placeholder = "Anything that applies every time — car seat needed, gate code, usual car, phone number…";
    instrInput.value = info.instructions;
    instrInput.rows = 1;
    let instrTimer;
    const commitInstr = () => {
      const v = instrInput.value.trim();
      state.families[id] = Object.assign({}, state.families[id], { instructions: v });
      api("/families/" + id + "/instructions", "PUT", v || null).catch(() => setStatus("Couldn't save — check your connection."));
    };
    instrInput.addEventListener("input", () => { clearTimeout(instrTimer); instrTimer = setTimeout(commitInstr, 600); });
    instrInput.addEventListener("blur", () => { clearTimeout(instrTimer); commitInstr(); render(); });
    card.appendChild(instrInput);

    famDiv.appendChild(card);
  });

  const daysDiv = document.getElementById("days");
  daysDiv.innerHTML = "";
  DAYS.forEach(day => {
    const dayEl = document.createElement("div");
    dayEl.className = "day";
    dayEl.innerHTML = '<div class="day-label">' + day + '</div>';
    const slotsEl = document.createElement("div");
    slotsEl.className = "slots";

    SLOT_TYPES.forEach(t => {
      const key = day + "_" + t.key;
      const slot = state.slots[key] || {};
      const slotEl = document.createElement("div");
      slotEl.className = "slot";

      const label = document.createElement("div");
      label.className = "slot-label";
      label.textContent = t.label;
      slotEl.appendChild(label);

      const assignedIdx = FAM_IDS.indexOf(slot.f);
      if (assignedIdx >= 0) {
        // Someone is assigned: show only their dot + name, large, plus a small Change button.
        const row = document.createElement("div");
        row.className = "assigned-row";
        const dot = document.createElement("div");
        dot.className = "assign-btn";
        dot.style.background = "var(--fam" + (assignedIdx + 1) + ")";
        row.appendChild(dot);
        const name = document.createElement("div");
        name.className = "assigned-name";
        name.textContent = famInfo(slot.f, assignedIdx).name;
        row.appendChild(name);
        const changeBtn = document.createElement("button");
        changeBtn.className = "change-btn";
        changeBtn.textContent = "Change";
        changeBtn.addEventListener("click", () => setSlot(key, { f: null }));
        row.appendChild(changeBtn);
        slotEl.appendChild(row);
      } else {
        const tag = document.createElement("div");
        tag.className = "tag empty";
        tag.textContent = "Nobody yet";
        slotEl.appendChild(tag);

        // Nobody assigned yet: show all family dots to choose from.
        const row = document.createElement("div");
        row.className = "assign-row";
        FAM_IDS.forEach((id, i) => {
          const info = famInfo(id, i);
          const b = document.createElement("button");
          b.className = "assign-btn";
          b.style.background = "var(--fam" + (i + 1) + ")";
          b.setAttribute("aria-label", info.name);
          b.addEventListener("click", () => setSlot(key, { f: id }));
          row.appendChild(b);
        });
        slotEl.appendChild(row);
      }

      const noteLabel = document.createElement("div");
      noteLabel.className = "note-label";
      noteLabel.textContent = "Additional notes";
      slotEl.appendChild(noteLabel);

      const note = document.createElement("input");
      note.className = "note";
      note.placeholder = "Just for this " + t.label.toLowerCase() + " — time, address…";
      note.value = slot.n || "";
      note.maxLength = 120;
      note.addEventListener("blur", () => {
        const v = note.value.trim() || null;
        if (v !== (slot.n || null)) setSlot(key, { n: v });
        else if (renderPending) render();
      });
      note.addEventListener("keydown", e => { if (e.key === "Enter") note.blur(); });
      slotEl.appendChild(note);

      slotsEl.appendChild(slotEl);
    });
    dayEl.appendChild(slotsEl);
    daysDiv.appendChild(dayEl);
  });
}

function setSlot(key, patch) {
  const next = Object.assign({}, state.slots[key] || {}, patch);
  Object.keys(next).forEach(k => next[k] == null && delete next[k]);
  state.slots[key] = next;
  render();
  api("/slots/" + key, "PATCH", patch).catch(() => setStatus("Couldn't save — check your connection."));
}

async function poll() {
  try {
    const data = (await api("")) || {};
    state.families = data.families || {};
    state.slots = data.slots || {};
    setStatus("Live — everyone with this link sees the same schedule.");
    render();
  } catch (e) {
    setStatus("Can't reach the database. Check DATABASE_URL and your Firebase rules.");
  }
}

function showBanner() {
  const b = document.getElementById("banner");
  b.hidden = false;
  b.innerHTML = "<strong>Share this exact link</strong> with the other families. The part after # is what connects you to the same schedule.<br><code>" +
    location.href + "</code><br><button id='copy'>Copy link</button>";
  document.getElementById("copy").onclick = () => {
    navigator.clipboard.writeText(location.href).then(() => { document.getElementById("copy").textContent = "Copied"; });
  };
}

document.addEventListener("focusout", () => setTimeout(() => { if (renderPending) render(); }, 0));

render();
if (isNewRoom) showBanner();
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
