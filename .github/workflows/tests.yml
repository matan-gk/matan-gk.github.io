# Runs the whole test suite (tests/) on every pull request and on every push to main.
# Optional: when the repository variable PAGES_VIA_ACTIONS is 'true' (and Settings > Pages > Source is
# "GitHub Actions"), the site is deployed from here, and only after the tests pass. See docs/ENHANCEMENTS.md.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package.json
      - name: Install Playwright and its Chromium
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run the suite, retrying a failed test once (a few checks are random)
        working-directory: tests
        run: |
          node run.js 2>&1 | tee suite.txt || {
            failed=$(grep -oP 'FAILED: \K.*' suite.txt | tail -1 | tr -d ' ')
            [ -n "$failed" ] || exit 1
            echo "::warning::retrying once: $failed"
            node run.js --only "$failed"
          }
      - name: Keep the logs and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-output
          path: tests/_out/
          retention-days: 7

  rules:
    # the Firestore security rules, against the Firestore emulator (firebase/rules-test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install and run the rules tests
        working-directory: firebase/rules-test
        run: |
          npm install
          npm test

  deploy:
    # off until the repository variable PAGES_VIA_ACTIONS is set to 'true'
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_VIA_ACTIONS == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Stamp the commit into the page (shown next to the version in the parent area)
        run: |
          sed -i "s/^const BUILD_COMMIT = '';/const BUILD_COMMIT = '${GITHUB_SHA}';/" math-quest.html
          grep -q "^const BUILD_COMMIT = '${GITHUB_SHA}';" math-quest.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
