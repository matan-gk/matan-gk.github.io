<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המסע הקסום של קאפקייק</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7c5cff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קאפקייק">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Fonts embedded so the game needs no outside requests: Rubik (Hebrew + Latin, weights 400/600/800) and Baloo 2 (Latin, 600/800).
   Both are SIL Open Font License 1.1 (Rubik: The Rubik Project Authors; Baloo 2: The Baloo 2 Project Authors). Source: Fontsource packages. */

@font-face{font-family:'Rubik';font-style:normal;font-weight:600;font-display:swap;src:url(assets/3dd0f7e001fe.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-style:normal;font-weight:600;font-display:swap;src:url(assets/3eefafb109fc.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Rubik';font-style:normal;font-weight:800;font-display:swap;src:url(assets/131deffb985c.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-style:normal;font-weight:800;font-display:swap;src:url(assets/a8c0371ecf43.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:600;font-display:swap;src:url(assets/0bc5672ad8e0.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:800;font-display:swap;src:url(assets/694f2e10bbbe.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg1:#fff0f7; --bg2:#ffe3f1; --card:#ffffff; --card2:#fff2fa;
  --pink:#ff6fb0; --purple:#9b6bff; --teal:#2fd7c4; --yellow:#ffc93c;
  --text:#3a2a4d; --muted:#8a7aa0; --good:#2fd7c4; --bad:#ff6f83;
  --shadow: rgba(155,107,255,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg1:#241934; --bg2:#2f2044; --card:#352646; --card2:#3f2d54;
    --text:#f5eeff; --muted:#c3b3dd; --shadow: rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg1:#241934; --bg2:#2f2044; --card:#352646; --card2:#3f2d54;
  --text:#f5eeff; --muted:#c3b3dd; --shadow: rgba(0,0,0,.4);
}

/* ===== SKINS (themes). The default (sweets) palette is the :root block above. A skin only re-declares the colour variables. ===== */
/* space, light: "Cosmic Laboratory" */
:root[data-skin="space"]{
  --bg1:#f0f4f8; --bg2:#dfeaf5; --card:#ffffff; --card2:#e8f1f8;
  --pink:#d94a00; --purple:#00758f; --teal:#18d6c8; --yellow:#ffc21a;
  --text:#12263a; --muted:#566b80; --good:#0ea58f; --bad:#e0455a;
  --shadow: rgba(0,117,143,.18); --h1a:#00758f; --h1b:#12b8cf;
}
/* space, dark: "Deep Space Fleet" (follows the phone's dark mode, or data-theme="dark") */
@media (prefers-color-scheme: dark){
  :root[data-skin="space"]:not([data-theme="light"]){
    --bg1:#0b0e14; --bg2:#1a1740; --card:#161c2c; --card2:#212a42;
    --pink:#ffc21a; --purple:#b77bff; --teal:#1de9d0; --yellow:#ffd23c;
    --text:#e8f0ff; --muted:#9fb1d1; --good:#1de9d0; --bad:#ff6b81; --shadow: rgba(0,0,0,.55); --h1a:var(--pink); --h1b:var(--purple); --on-accent:#0b0e14;
  }
}
:root[data-skin="space"][data-theme="dark"]{
  --bg1:#0b0e14; --bg2:#1a1740; --card:#161c2c; --card2:#212a42;
  --pink:#ffc21a; --purple:#b77bff; --teal:#1de9d0; --yellow:#ffd23c;
  --text:#e8f0ff; --muted:#9fb1d1; --good:#1de9d0; --bad:#ff6b81; --shadow: rgba(0,0,0,.55); --h1a:var(--pink); --h1b:var(--purple); --on-accent:#0b0e14;
}
/* the parent area (settings, guide, backup, report) is never themed: it always uses the default palette */
#profOverlay, #reportOverlay, #sampleOverlay{
  --bg1:#fff0f7; --bg2:#ffe3f1; --card:#ffffff; --card2:#fff2fa; --pink:#ff6fb0; --purple:#9b6bff; --teal:#2fd7c4; --yellow:#ffc93c;
  --text:#3a2a4d; --muted:#8a7aa0; --good:#2fd7c4; --bad:#ff6f83; --shadow: rgba(155,107,255,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) :is(#profOverlay, #reportOverlay, #sampleOverlay){
    --bg1:#241934; --bg2:#2f2044; --card:#352646; --card2:#3f2d54; --text:#f5eeff; --muted:#c3b3dd; --shadow: rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] :is(#profOverlay, #reportOverlay, #sampleOverlay){
  --bg1:#241934; --bg2:#2f2044; --card:#352646; --card2:#3f2d54; --text:#f5eeff; --muted:#c3b3dd; --shadow: rgba(0,0,0,.4);
}
.thchips{display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 10px}
.thcov{width:100%; border-collapse:collapse; font-size:.85rem}
.thcov td{padding:6px 4px; border-top:1px solid var(--pa-line)}
.thcov td:last-child{text-align:end; font-weight:800; white-space:nowrap}
.thcov .done{color:var(--good)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{
  margin:0; min-height:100%; font-family:'Rubik',sans-serif; color:var(--text);
  background:radial-gradient(circle at 15% 0%, var(--bg2) 0%, var(--bg1) 60%);
  display:flex; justify-content:center; padding:16px; overflow-x:hidden; position:relative;
}
.wrap{width:100%; max-width:560px; position:relative; z-index:2}
h1{
  font-family:'Baloo 2',sans-serif; font-size:1.4rem; text-align:center; margin:4px 0 2px;
  background:linear-gradient(90deg,var(--h1a,var(--pink)),var(--h1b,var(--purple))); -webkit-background-clip:text; background-clip:text; color:transparent;
}
.sub{text-align:center; color:var(--muted); font-size:.88rem; margin-bottom:10px}
.hud{display:flex; gap:8px; justify-content:center; margin-bottom:10px; flex-wrap:wrap}
.chip{
  background:var(--card2); border-radius:999px; padding:6px 14px; font-size:.85rem;
  display:flex; align-items:center; gap:6px; font-weight:600; box-shadow:0 4px 10px var(--shadow);
}
.stickerbook{
  display:flex; gap:4px; flex-wrap:wrap; justify-content:center; min-height:34px;
  margin-bottom:8px; background:var(--card2); border-radius:14px; padding:6px 8px;
}
.lollibook{background:var(--card2); border-radius:14px; padding:8px 10px; margin-bottom:14px}
.lollilabel{display:block; font-size:.75rem; font-weight:700; color:var(--purple); margin-bottom:4px}
.lolliitems{display:flex; gap:2px; flex-wrap:wrap; min-height:32px; justify-content:center}
.lolliitems img{width:38px; height:auto; filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.lolliitems .empty{font-size:.78rem; color:var(--muted); font-weight:600}
.lollilabel img.inline-cotton{width:16px; height:auto; vertical-align:-3px; margin-left:3px}
.feedback img.inline-cotton{width:22px; height:auto; vertical-align:-6px; margin:0 3px}
.card.bonus-mode{
  border:3px solid var(--yellow);
  box-shadow:0 14px 34px rgba(255,196,60,.45);
  background:linear-gradient(160deg, var(--card) 78%, rgba(255,196,60,.14) 100%);
}
.bonustag{
  display:inline-block; background:linear-gradient(90deg,var(--yellow),var(--pink));
  color:#4a2a00; padding:3px 12px; border-radius:999px; font-weight:800;
  font-family:'Baloo 2',sans-serif; font-size:.82rem; margin-left:6px;
}

.rewardstrip{
  width:100%; max-width:100%; min-width:0; display:flex; flex-direction:column; align-items:stretch; gap:6px; background:var(--card2); border:2px solid transparent;
  border-radius:14px; padding:8px 12px; margin-bottom:12px; cursor:pointer; color:var(--text);
  font-family:'Rubik',sans-serif; box-shadow:0 4px 10px var(--shadow); text-align:start;
}
.rewardstrip:active{transform:scale(.98)}
.rs-title{font-weight:800; font-size:.85rem; color:var(--purple); white-space:nowrap}
.rs-top{display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; min-width:0}
.rs-top .rs-count{margin-inline-start:auto}
.rs-recent{display:flex; gap:6px; justify-content:space-around; min-width:0}
.rs-item{display:flex; align-items:center; gap:2px; direction:ltr}
.rs-item .e{font-size:1.6rem; line-height:1}
.rs-item b{font-family:'Baloo 2',sans-serif; font-size:.8rem; color:var(--pink); font-weight:800}
.rs-recent .rs-empty{font-size:.78rem; color:var(--muted); font-weight:600}
.rs-item.new .e{display:inline-block; animation:rspop .5s}
@keyframes rspop{0%{transform:scale(.2)} 60%{transform:scale(1.5)} 100%{transform:scale(1)}}
.rs-cotton{direction:ltr; display:flex; align-items:center; gap:3px; font-weight:800; font-size:.85rem}
.rs-cotton img{width:22px; height:auto}
.rs-count{font-weight:800; font-size:.9rem; white-space:nowrap; color:var(--pink)}
.roomoverlay{position:fixed; inset:0; background:rgba(30,15,50,.6); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px}
.roomoverlay[hidden]{display:none}
.adultcheck{max-width:420px; width:100%; text-align:center}
.adultcheck h2{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.4rem; color:var(--purple); margin:0 0 8px}
.adultcheck .ac-sub{font-size:.9rem; color:var(--muted); margin-bottom:16px; line-height:1.4}
.adultcheck .ac-inputwrap{display:flex; gap:8px; justify-content:center; margin-bottom:16px}
.adultcheck input[type=number]{width:120px; min-height:48px; font-size:1.2rem; text-align:center; border:2px solid var(--card2); border-radius:12px; background:var(--card2); color:var(--text); font-family:'Rubik',sans-serif; font-weight:600}
.adultcheck .ac-error{color:var(--bad); font-weight:600; font-size:.85rem; min-height:1.2em; margin-bottom:8px}
.adultcheck .ac-actions{display:flex; gap:8px; justify-content:center}
.adultcheck .pa-btn{min-width:120px}
.room{
  background:var(--card); width:100%; max-width:560px; max-height:85vh; border-radius:22px;
  display:flex; flex-direction:column; box-shadow:0 20px 50px rgba(0,0,0,.4); animation:roomup .22s ease-out;
}
@keyframes roomup{from{transform:scale(.9); opacity:0} to{transform:none; opacity:1}}
.roomhead{display:flex; align-items:center; justify-content:space-between; padding:14px 16px 8px}
.roomtitle{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.2rem; color:var(--purple)}
.roomclose{border:0; background:var(--card2); color:var(--text); width:36px; height:36px; border-radius:50%; font-size:1.1rem; cursor:pointer; font-weight:800}
.roombody{overflow-y:auto; padding:4px 16px 20px}
.roomsec{font-size:.8rem; font-weight:800; color:var(--muted); margin:10px 0 8px}
.roomgrid{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
.ritem{background:var(--card2); border-radius:12px; width:calc(50px*var(--rz)); height:calc(50px*var(--rz)); display:flex; align-items:center; justify-content:center}
.ritem .remoji{font-size:calc(1.9rem*var(--rz)); line-height:1; display:inline-flex}
.ritem .remoji img.rg{width:calc(38px*var(--rz)); height:calc(38px*var(--rz)); object-fit:contain; filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.rs-item .e img.rg{display:block; object-fit:contain}
.confetti img.rg{display:block; object-fit:contain}
.ritem img{width:calc(36px*var(--rz)); height:auto; filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.rbadge{
  position:absolute; bottom:-6px; left:-4px; background:var(--pink); color:var(--on-accent,#fff); font-family:'Baloo 2',sans-serif;
  font-weight:800; font-size:.78rem; min-width:26px; text-align:center; padding:1px 7px; border-radius:999px; direction:ltr;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.roomempty{text-align:center; color:var(--muted); font-weight:600; padding:30px 0}

.rs-ready{background:linear-gradient(90deg,var(--yellow),var(--pink)); color:#4a2a00; font-weight:800; font-size:.72rem; padding:2px 9px; border-radius:999px; animation:rspulse 1.4s infinite; white-space:nowrap}
@keyframes rspulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.08)}}
.rs-gold{direction:ltr; display:flex; align-items:center; gap:2px; font-weight:800; font-size:.85rem}
.rs-gold b{font-family:'Baloo 2',sans-serif; color:var(--pink)}
.roomoverlay.celeb{z-index:70}
.celebbox{max-width:420px; padding:22px 18px 18px; text-align:center; align-items:stretch}
.celebbody{display:flex; flex-direction:column; align-items:center; gap:8px}
.cbig{min-height:calc(110px*var(--rz)); display:flex; align-items:center; justify-content:center; animation:cpop .6s}
.cbig img{height:calc(110px*var(--rz)); width:auto; max-width:100%}
.cbig.look img{height:190px}
.ritem.tap{cursor:pointer}
@keyframes cpop{0%{transform:scale(.2) rotate(-12deg)} 60%{transform:scale(1.2) rotate(4deg)} 100%{transform:scale(1) rotate(0)}}
.ctitle{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.35rem; color:var(--purple)}
.csub{font-size:.95rem; color:var(--text); font-weight:600}
.cmerge{display:flex; flex-wrap:wrap; gap:4px; justify-content:center; min-height:110px; align-content:center; max-width:calc(300px*var(--rz))}
.cmerge span{font-size:2rem; display:inline-flex; transition:transform .9s cubic-bezier(.6,-0.3,.4,1.2), opacity .9s}
.cmerge img{height:calc(34px*var(--rz))}
.cmerge.go span{transform:scale(0) translateY(-20px); opacity:0}
.celebbtns{display:flex; flex-direction:column; gap:8px; margin-top:14px}
.celebbtns .btn{width:100%}
.celebbtns .btn.ghost{background:var(--card2); color:var(--text)}
.mcard{display:flex; align-items:center; gap:8px; background:var(--card2); border-radius:14px; padding:8px 10px; margin-bottom:8px}
.mcard .mfrom,.mcard .mto{display:flex; align-items:center; gap:3px; font-family:'Baloo 2',sans-serif; font-weight:800; direction:ltr}
.mcard .mfrom b{font-size:.9rem; color:var(--pink)}
.mcard .marrow{font-size:1.2rem; color:var(--muted)}
.mcard .mbtn{margin-inline-start:auto; border:0; border-radius:999px; padding:8px 14px; font-weight:800; font-family:'Rubik',sans-serif; background:linear-gradient(90deg,var(--yellow),var(--pink)); color:#4a2a00; cursor:pointer}
.ritem.gold{box-shadow:inset 0 0 0 2px var(--yellow), 0 0 8px rgba(255,196,60,.55)}
.ritem.gold img{height:calc(40px*var(--rz)); width:auto; max-width:calc(44px*var(--rz))}
.ritem img.cot{height:calc(40px*var(--rz)); width:auto}
.gfall{position:relative; display:inline-flex; align-items:center; justify-content:center; filter:drop-shadow(0 0 5px #ffc93c)}
.gfall::after{content:'✨'; position:absolute; top:-6px; right:-8px; font-size:.55em}
.vault{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:10px; justify-items:center}
.vitem{display:flex; align-items:center; justify-content:center}
.roomfilt{margin:0 0 8px}
.alltap{cursor:pointer}
.ritem.merged{position:relative}
.wardskt{position:absolute; top:-6px; right:-6px; font-size:.7em; filter:drop-shadow(0 0 3px #ffc93c); animation:wardpop .8s ease-out}
@keyframes wardpop{0%{transform:scale(0) rotate(-20deg)} 50%{transform:scale(1.3) rotate(5deg)} 100%{transform:scale(1) rotate(0)}}
.wardrobe{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px}
.look{height:72px; border-radius:14px; background:var(--card2); display:flex; align-items:center; justify-content:center; border:3px solid transparent; cursor:pointer; position:relative; padding:3px}
.look img{max-height:100%; max-width:100%; object-fit:contain}
.lookx{position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); border:0; border-radius:10px; padding:2px 8px; font:700 .6rem 'Rubik',sans-serif; background:var(--card); color:var(--muted); box-shadow:0 1px 4px rgba(0,0,0,.25); cursor:pointer}
.ritem.gold{cursor:pointer}
.inl{display:inline-flex; vertical-align:middle}
.kgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:8px 0 2px}
.kpick{background:var(--card2); border:2px solid transparent; border-radius:10px; padding:4px; cursor:pointer; display:flex; justify-content:center}
.kpick.on{border-color:var(--pink)}
.celebbody.need .kgrid{outline:2px solid var(--bad); border-radius:10px}
.look.locked{cursor:default}
.look.locked img{filter:brightness(0); opacity:.12}
.look.locked::after{content:''; position:absolute; width:1.3rem; height:1.3rem; background:var(--ic-lock) center/contain no-repeat}
.look.active{border-color:var(--pink); box-shadow:0 0 10px rgba(255,111,176,.5)}
.toknew{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-weight:800}
.toknew .tokimg{width:auto}
.tokchip{display:flex;align-items:center;gap:10px;background:var(--card,#fff);border-radius:14px;padding:8px 12px;margin:0 0 10px;box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:800}
.tokchip .tokimg{width:auto;flex:none}
.tokchip .tokzero{font-size:1.8rem;opacity:.4}
.tokchip .roomhint{margin:0}
.roomhint{font-size:.75rem; color:var(--muted); margin:2px 0 8px; font-weight:600}

/* emoji that have an image: the emoji stays in the page as invisible text (so copy, screen readers and the game logic still see it) and the image is its background */
.ic{display:inline-block; width:1.15em; height:1.15em; vertical-align:-.22em; background:center/contain no-repeat; color:transparent; -webkit-text-fill-color:transparent; text-shadow:none; overflow:hidden; white-space:nowrap; line-height:1; font-style:normal; letter-spacing:0}
.chipbtn{border:0; cursor:pointer; color:var(--text); font-family:'Rubik',sans-serif}
.chipbtn:active{transform:scale(.97)}
.roomoverlay.profs{z-index:60}
.prow{display:flex; align-items:center; gap:10px; background:var(--card2); border:2px solid transparent; border-radius:14px; padding:10px; margin-bottom:8px}
.prow.active{border-color:var(--yellow)}
.pav{font-size:2rem; line-height:1}
.pinfo{flex:1; min-width:0; display:flex; flex-direction:column}
.pinfo b{font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pinfo small{color:var(--muted); font-weight:600}
.pinfo small .nw{white-space:nowrap}
.pact{display:flex; gap:6px; align-items:center}
.pbtn{border:0; border-radius:999px; padding:7px 12px; font-weight:800; font-family:'Rubik',sans-serif; cursor:pointer; background:var(--card); color:var(--text); font-size:.85rem}
.pbtn.main{background:linear-gradient(90deg,var(--teal),var(--purple)); color:#fff}
.pbtn.danger{background:var(--bad); color:#3a0a12}
.pbadge{font-size:.78rem; font-weight:800; color:var(--teal)}

/* ---- game selection screen and "locations" ---- */
#backdrop{position:fixed; inset:0; z-index:0; display:none; background:var(--bg1) center/cover no-repeat; opacity:0; transition:opacity .3s}

.levelbtn .lvimg.cut, .roombtn .lvimg.cut{border-radius:0; box-shadow:none; object-fit:contain; background:none; filter:drop-shadow(0 3px 5px var(--shadow))}
body[data-view="play"] #levels, body[data-view="play"] .wrap > .sub{display:none}
body[data-view="play"] h1{background:var(--card); color:var(--text); -webkit-background-clip:border-box; background-clip:border-box; border-radius:16px; padding:6px 14px; margin:0 auto 8px; width:max-content; max-width:100%; box-shadow:0 4px 12px var(--shadow)}

.levels{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; margin:-6px -4px 14px; padding:8px 4px 8px}   /* 8 levels: 3 per row on phones (a short last row gets wider buttons), 4 per row on tablets, one row on large screens */
.levelbtn{
  min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--card); border:2px solid transparent; border-radius:16px;
  padding:10px 8px; text-align:center; cursor:pointer; color:var(--text); font-family:'Baloo 2',sans-serif;

}

.levels[data-rem="2"] .levelbtn:nth-last-child(-n+2){grid-column:span 3}

.mxc.q{background:#f1ecff; color:var(--purple); font-size:2rem; font-weight:800}
.gl{line-height:1; font-family:'Baloo 2',sans-serif}
.choice.grid-choice{display:flex; justify-content:center; align-items:center; padding:10px 6px; min-height:70px}
.choices{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
.choice{
  background:var(--card2); border:2px solid transparent; border-radius:14px; padding:14px 8px;
  font-size:1.1rem; font-weight:800; font-family:'Baloo 2',sans-serif; cursor:pointer; color:var(--text);
  transition:.12s;
}
.choice{text-align:center}
.choice:active{transform:scale(.96)}
.grp{white-space:nowrap; display:inline-block}
.clkq{display:flex; justify-content:center; margin:4px 0 10px}
.clk{display:inline-block; line-height:0}
.clksvg{display:block; max-width:100%; height:auto; direction:ltr}
.clkpair{display:flex; gap:14px; justify-content:center; align-items:flex-start; margin:4px 0 10px; flex-wrap:wrap}
.clkcap{text-align:center; font-weight:800; font-size:.8rem; color:var(--muted); line-height:1.3; margin-top:4px}
.choice.grid-choice .clksvg{width:100%; max-width:118px}
.choice.nowrapchoice{white-space:nowrap; overflow:hidden}
.choice.emoji-choice{font-size:3rem; padding:12px 6px; line-height:1.1; word-break:break-word}
.choice.correct{background:var(--good); color:#083330; border-color:var(--good)}
.choice.wrong{background:var(--bad); color:#3a0a12; border-color:var(--bad)}
#answerForm{display:flex; gap:10px; margin-bottom:12px}
#answerForm input{
  flex:1; font-size:1.25rem; font-family:'Baloo 2',sans-serif; text-align:center; direction:ltr;
  border-radius:14px; border:2px solid var(--card2); background:var(--card2); color:var(--text); padding:12px;
}
#answerForm input:focus{outline:none; border-color:var(--pink)}
.btn{
  background:linear-gradient(90deg,var(--pink),var(--purple)); color:var(--on-accent,#fff); border:none; border-radius:14px; padding:12px 20px;
  font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1rem; cursor:pointer;
}
#answerForm .btn{width:auto}
.btn.wide{width:100%}
.btn.secondary{background:var(--teal); color:#083330; display:none; width:100%; margin-top:4px}
.btn:active{transform:scale(.98)}
.feedback{margin-top:10px; font-weight:700; text-align:center; min-height:24px; font-size:.95rem}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}
.confetti{position:fixed; top:0; left:0; font-size:1.6rem; pointer-events:none; z-index:50; animation:fall linear forwards}
@keyframes fall{ to{ transform:translateY(110vh) rotate(var(--rot)); opacity:0.2 } }
.milestone{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:60;
  background:rgba(58,42,77,.35); backdrop-filter:blur(2px); animation:pop .25s;
}
.milestone .box{
  background:var(--card); border-radius:24px; padding:28px 24px; text-align:center; max-width:320px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
}
.milestone .box .big{font-size:3rem; margin-bottom:6px}
.milestone .box h2{font-family:'Baloo 2',sans-serif; margin:4px 0; color:var(--pink)}
@keyframes pop{ from{opacity:0; transform:scale(.8)} to{opacity:1; transform:scale(1)} }

.charwrap{display:flex; justify-content:center; margin-bottom:8px}
.charimg{width:150px; height:auto; filter:drop-shadow(0 8px 14px var(--shadow)); transition:transform .25s;}
.charimg.bounce{animation:bounce .5s}
:root[data-skin="space"] .charimg{width:auto; height:190px; max-width:260px; object-fit:contain}
@keyframes bounce{ 0%{transform:scale(1)} 30%{transform:scale(1.18) rotate(-4deg)} 60%{transform:scale(.96) rotate(3deg)} 100%{transform:scale(1)} }
.milestone .box img{width:150px; margin-bottom:6px}
[data-skin="space"] .milestone .box img{width:auto; height:190px; max-width:210px; object-fit:contain}
@media (min-width:720px){ .wrap{max-width:720px} .levels{grid-template-columns:repeat(4,minmax(0,1fr))} .levels .levelbtn, .levels .roombtn, .levels[data-rem] .roombtn, .levels[data-rem] .levelbtn:last-child, .levels[data-rem] .levelbtn:nth-last-child(-n+2){grid-column:auto} }
@media (min-width:1100px){ .wrap{max-width:880px} .levels{grid-template-columns:repeat(8,minmax(0,1fr))} .levelbtn{font-size:.95rem; padding:12px 8px} .card{padding:28px 28px} }
/* selection screen: the game grid is the main control, so it grows with the room available */
@media (min-width:480px){ body[data-view="home"] .levelbtn .lvimg, body[data-view="home"] .roombtn .lvimg{width:84px; height:84px} body[data-view="home"] .levelbtn .lvimg.cut, body[data-view="home"] .roombtn .lvimg.cut{width:72px; height:72px} body[data-view="home"] .levelbtn, body[data-view="home"] .roombtn{font-size:.95rem; padding:12px 8px} body[data-view="home"] .levelbtn .emoji, body[data-view="home"] .roombtn .emoji{font-size:3.6rem} }
@media (min-width:720px){ body[data-view="home"] .wrap{max-width:860px} body[data-view="home"] .levels{gap:14px} body[data-view="home"] .levelbtn .lvimg, body[data-view="home"] .roombtn .lvimg{width:120px; height:120px; border-radius:20px} body[data-view="home"] .levelbtn, body[data-view="home"] .roombtn{font-size:1.1rem; padding:16px 10px; border-radius:20px} body[data-view="home"] .levelbtn .emoji, body[data-view="home"] .roombtn .emoji{font-size:3.6rem} body[data-view="home"] .levelbtn .lvimg.cut, body[data-view="home"] .roombtn .lvimg.cut{width:96px; height:96px} body[data-view="home"] .charimg{width:110px} body[data-view="home"] .levelbtn, body[data-view="home"] .roombtn{padding:12px 10px} }
@media (min-width:1100px){ body[data-view="home"] .wrap{max-width:1040px} body[data-view="home"] .levels{grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px} body[data-view="home"] .levelbtn .lvimg, body[data-view="home"] .roombtn .lvimg{width:150px; height:150px} body[data-view="home"] .levelbtn .lvimg.cut, body[data-view="home"] .roombtn .lvimg.cut{width:112px; height:112px} body[data-view="home"] .levelbtn .emoji, body[data-view="home"] .roombtn .emoji{font-size:4.2rem} body[data-view="home"] .levelbtn, body[data-view="home"] .roombtn{font-size:1.25rem; padding:14px 12px} }
/* location view: slightly see-through question card, so more of the backdrop shows */
body[data-view="play"] .card{background:color-mix(in srgb, var(--card) 76%, transparent); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
/* top bar: profile menu, score and streak, and the compact gift square stay at the top of the screen */
.topbar{position:sticky; top:0; z-index:40; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin:0 0 6px; padding:6px 0 4px}
.topbar .hud{flex-direction:column; align-items:stretch; gap:4px; margin:0; flex:none}
.topbar .chip{padding:3px 12px; font-size:.8rem; justify-content:space-between; background:var(--card); gap:8px}
.topbar .rewardstrip{width:72px; height:72px; flex:none; margin:0; padding:4px 3px; gap:0; align-items:center; justify-content:center; position:relative; background:var(--card); border-radius:16px}
.topbar .rs-title, .topbar .rs-cotton, .topbar .rs-gold{display:none !important}
.topbar .rs-top{order:2; justify-content:center; gap:0}
.topbar .rs-count{margin:0; font-size:.62rem; line-height:1}
.topbar .rs-ready{position:absolute; top:-7px; inset-inline-start:-5px; font-size:.58rem; padding:1px 7px; white-space:nowrap}
.topbar .rs-recent{order:1; justify-content:center}
.topbar .rs-item:not(:first-child){display:none}
.topbar .rs-item .e{font-size:1.9rem}
.topbar .rs-item b{font-size:.72rem}
.topbar .rs-recent .rs-empty{font-size:.62rem; text-align:center; line-height:1.25; padding:0 2px}
.charreward{display:none; position:absolute; bottom:24%; left:calc(50% + 70px); font-size:44px; background:var(--card); border-radius:50%; padding:6px; box-shadow:0 4px 12px var(--shadow); line-height:0}
.charreward.on{display:block; animation:rspop .5s}
.charwrap{position:relative}
/* small screens (phones): the mascot is not on screen all the time; she peeks in after an answer, with the new reward, then leaves */
@media (max-width:767px), (max-height:599px){
  .charwrap{display:none}
  .charwrap.peek{display:flex; position:fixed; left:0; right:0; bottom:calc(12px + env(safe-area-inset-bottom)); margin:0; z-index:45; pointer-events:none; animation:peekin .35s ease-out}
  .charwrap.peek .charimg, :root[data-skin="space"] .charwrap.peek .charimg, body[data-view] .charwrap.peek .charimg{width:auto; height:150px; max-width:70vw; object-fit:contain}
  .charwrap.peek .charimg{filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
  .charwrap.peek .charreward.on{left:calc(50% + 62px); bottom:26px}
}
@keyframes peekin{from{transform:translateY(40px); opacity:0} to{transform:none; opacity:1}}
/* large screens (about 10-inch tablets and up, any orientation): she stays below the question, at the bottom-centre of the picture */
@media (min-width:768px) and (min-height:600px){
  .topbar .rewardstrip{width:92px; height:92px}
  .topbar .rs-item .e{font-size:2.4rem}
  .topbar .rs-count{font-size:.72rem}
  .topbar .chip{font-size:.95rem; padding:5px 16px}
  body[data-view="play"] .wrap{padding-bottom:calc(min(26vh,240px) + 7vh + 8px)}
  body[data-view="play"] .charwrap{position:fixed; left:0; right:0; bottom:7vh; margin:0; z-index:1; pointer-events:none}
  body[data-view="play"] .charimg, :root[data-skin="space"] body[data-view="play"] .charimg{width:auto; height:min(26vh,240px); max-width:340px; object-fit:contain}
  .charreward{font-size:52px}
  .charreward.on{left:calc(50% + 100px); bottom:20%}
}
/* ===== PARENT AREA (אזור הורים): full screen, fixed layout, one set of components ===== */
:root{--pa-bg:#f3eefa; --pa-line:rgba(120,90,170,.16)}

// ===== CLOUD CORE (pure, testable) =====
// Sync planner. Local profile: {id,u,sy}  u = last change time, sy = the cloud version (cloud u) it was last in step with.
// Cloud doc: {id,u,d}  d = true for a deleted profile (kept as a marker so other devices delete it too).
// gone = [{id,u}] local deletions not yet marked in the cloud. Returns a list of actions; nothing is changed here.
function cloudPlan(local, gone, docs, maxProfiles){
  const acts = [], byId = {}; docs.forEach(d=>byId[d.id]=d);
  const goneIds = {}; (gone||[]).forEach(g=>goneIds[g.id]=g);
  let count = local.length;
  local.forEach(L=>{
    const C = byId[L.id];
    if(!C){ acts.push({op:'push', id:L.id, base:0}); return; }
    if(C.d){
      if((L.u||0) > (C.u||0)) acts.push({op:'push', id:L.id, base:C.u||0});     // changed after it was deleted elsewhere: keep it
      else { acts.push({op:'removeLocal', id:L.id}); count--; }
      return;
    }
    const sy = L.sy||0, lc = (L.u||0) > sy, cc = (C.u||0) > sy;
    if(lc && cc){ const cloudWins = (C.u||0) > (L.u||0); acts.push({op: cloudWins?'pull':'push', id:L.id, base:C.u||0, conflict:true}); }
    else if(lc) acts.push({op:'push', id:L.id, base:C.u||0});
    else if(cc) acts.push({op:'pull', id:L.id});
  });
  (gone||[]).forEach(g=>{
    const C = byId[g.id];
    if(C && !C.d){
      if((C.u||0) > (g.u||0)) acts.push({op:'adopt', id:g.id, resurrect:true}); // changed elsewhere after the deletion: it comes back
      else acts.push({op:'tombstone', id:g.id, u:g.u, base:C.u||0});
    } else acts.push({op:'forgetGone', id:g.id});
  });
  docs.forEach(C=>{
    if(C.d || goneIds[C.id] || local.some(L=>L.id===C.id)) return;
    acts.push({op:'adopt', id:C.id});
  });
  // enforce the profile limit on adoptions
  let room = maxProfiles - count, out = [];
  acts.forEach(a=>{ if(a.op==='adopt'){ if(room>0){ room--; out.push(a); } else out.push({op:'skipAdopt', id:a.id}); } else out.push(a); });
  return out;
}
// Profile <-> cloud document. Progress and stats are stored as JSON text: one field each, no per-field indexing, no nesting limits.
function cloudDocFromProfile(p, maxStatsChars, base){
  let stats = p.stats ? JSON.parse(JSON.stringify(p.stats)) : null, s = stats ? JSON.stringify(stats) : '';
  while(stats && s.length > maxStatsChars && stats.log.length > 50){ stats.log = stats.log.slice(Math.ceil(stats.log.length*0.1)); s = JSON.stringify(stats); }
  return {n:String(p.name||'').slice(0,20), g:p.gender, p:JSON.stringify(p.progress||{}), s, u:p.u||0, b:base||0, d:false, v:1};   // b = the cloud version this change builds on; the security rules reject the write if the cloud has moved on
}
function cloudProfileFromDoc(C, helpers){
  let prog = {}, stats = null;
  try{ prog = JSON.parse(C.p||'{}'); }catch(e){}
  try{ stats = C.s ? JSON.parse(C.s) : null; }catch(e){}
  return {id:C.id, name:String(C.n||'').slice(0,20), gender:helpers.genders[C.g]?C.g:'n', progress:helpers.cleanProgress(prog), stats:helpers.statsSanitize(stats), u:C.u||0, sy:C.u||0};
}

function newFamilyId(){ const b = new Uint8Array(FAM_LEN); (window.crypto||window.msCrypto).getRandomValues(b); let t = ''; for(let i=0;i<FAM_LEN;i++) t += FAM_ALPHABET[b[i]&31]; return t; }
function famClean(t){ return String(t||'').toUpperCase().replace(/[\s\-_.]/g,''); }

// ---- adapter: the only code that talks to Firebase ----
function firebaseAdapter(cfg){
  let M = {}, auth, db;
  const famCol = fid => M.collection(db,'families',fid,'profiles');
  const oldCol = uid => M.collection(db,'users',uid,'profiles');
  const wipeCol = async ref => { const sn = await M.getDocs(ref); const bt = M.writeBatch(db); sn.docs.forEach(d=>bt.delete(d.ref)); if(sn.docs.length) await bt.commit(); };
  return {
    async init(){
      const [a,au,fs] = await Promise.all([import(FB_BASE+'firebase-app.js'), import(FB_BASE+'firebase-auth.js'), import(FB_BASE+'firebase-firestore.js')]);
      M = Object.assign({}, a, au, fs);
      const app = M.initializeApp(cfg); auth = M.getAuth(app); db = M.getFirestore(app);
    },
    onAuth(cb){ return M.onAuthStateChanged(auth, u=>cb(u ? {uid:u.uid, email:u.email||'', name:u.displayName||'', anon:u.isAnonymous} : null)); },
    async signIn(){ await M.signInWithPopup(auth, new M.GoogleAuthProvider()); },
    async signOut(){ await M.signOut(auth); },
    async anon(){ const c = await M.signInAnonymously(auth); return {uid:c.user.uid, email:'', name:'', anon:true}; },
    async deleteAuth(){ try{ await M.deleteUser(auth.currentUser); }catch(e){} },
    // an account's family id
    async getFamily(uid){ const sn = await M.getDoc(M.doc(db,'users',uid)); return sn.exists() ? String(sn.data().fid||'') : ''; },
    async setFamily(uid, fid){ await M.setDoc(M.doc(db,'users',uid), {fid, t:Date.now()}); },
    async clearFamily(uid){ try{ await M.deleteDoc(M.doc(db,'users',uid)); }catch(e){} },
    // the family's profiles
    async list(fid){ const sn = await M.getDocs(famCol(fid)); return sn.docs.map(d=>Object.assign({id:d.id}, d.data())); },
    async put(fid, id, doc){   // doc.b must equal the stored version (checked by the security rules, no read needed)
      try{ await M.setDoc(M.doc(db,'families',fid,'profiles',id), doc); return {ok:true}; }

async function cloudSync(reason){

// ===== SAVE CODES =====
// A save code is one line of text: CQ1.<z|r>.<payload>.<check>
//   z = payload is deflate-compressed, r = raw JSON; payload is base64url; check = CRC-32 of the payload bytes (catches typos and cut-off codes).
// The JSON inside: {app:'cupcake-quest', v:1, saved:ISO date, kind:'one'|'all', profiles:[{id,name,gender,progress,stats?}]}
// ===== SAVE CODE CODEC =====
const SC_PREFIX = 'CQ1', SC_MAX_CHARS = 8000000, SC_MAX_BYTES = 40000000;
let scCrcTable = null;
function scCrc(bytes){
  if(!scCrcTable){ scCrcTable = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320^(c>>>1)) : (c>>>1); scCrcTable[n]=c>>>0; } }
  let c = 0xFFFFFFFF; for(let i=0;i<bytes.length;i++) c = scCrcTable[(c^bytes[i])&255] ^ (c>>>8);
  return ((c^0xFFFFFFFF)>>>0).toString(16).padStart(8,'0');
}
function scB64Enc(bytes){ let s=''; for(let i=0;i<bytes.length;i+=8192) s += String.fromCharCode.apply(null, bytes.subarray(i,i+8192)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function scB64Dec(str){ str = str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; const bin = atob(str), out = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
async function scPipe(bytes, stream, limit){
  const reader = new Blob([bytes]).stream().pipeThrough(stream).getReader(), chunks = []; let n = 0;
  for(;;){ const r = await reader.read(); if(r.done) break; n += r.value.length; if(limit && n>limit){ try{ reader.cancel(); }catch(e){} throw new Error('too big'); } chunks.push(r.value); }
  const out = new Uint8Array(n); let o = 0; chunks.forEach(c=>{ out.set(c,o); o+=c.length; }); return out;
}
async function saveCodeEncode(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  let bytes = raw, flag = 'r';
  if(typeof CompressionStream!=='undefined'){ try{ bytes = await scPipe(raw, new CompressionStream('deflate-raw')); flag = 'z'; }catch(e){ bytes = raw; flag = 'r'; } }
  return [SC_PREFIX, flag, scB64Enc(bytes), scCrc(bytes)].join('.');
}
// returns {ok:true, data} or {ok:false, error:'empty'|'format'|'checksum'|'unsupported'|'broken'|'foreign'}
async function saveCodeDecode(text){
  const t = String(text||'').replace(/\s+/g,'');
  if(!t) return {ok:false, error:'empty'};
  if(t.length>SC_MAX_CHARS) return {ok:false, error:'format'};
  const parts = t.split('.');
  if(parts.length!==4 || parts[0]!==SC_PREFIX || !/^[zr]$/.test(parts[1]) || !/^[A-Za-z0-9_-]*$/.test(parts[2]) || !/^[0-9a-f]{8}$/i.test(parts[3])) return {ok:false, error:'format'};
  let bytes; try{ bytes = scB64Dec(parts[2]); }catch(e){ return {ok:false, error:'format'}; }
  if(scCrc(bytes)!==parts[3].toLowerCase()) return {ok:false, error:'checksum'};
  try{
    if(parts[1]==='z'){
      if(typeof DecompressionStream==='undefined') return {ok:false, error:'unsupported'};
      bytes = await scPipe(bytes, new DecompressionStream('deflate-raw'), SC_MAX_BYTES);
    }
    const data = JSON.parse(new TextDecoder().decode(bytes));
    if(!data || data.app!=='cupcake-quest' || data.v!==1 || !Array.isArray(data.profiles)) return {ok:false, error:'foreign'};
    return {ok:true, data};
  }catch(e){ return {ok:false, error:'broken'}; }
}
// ===== /SAVE CODE CODEC =====

// what goes into a code: selected profiles, optionally with their statistics
function saveCodePayload(profiles, withStats){
  return {app:'cupcake-quest', v:1, saved:new Date().toISOString(), kind:'save', withStats:!!withStats,
    profiles: profiles.map(p=>{
      const o = {id:p.id, name:p.name||'', gender:p.gender, progress:cleanProgress(p.id===store.activeId ? captureProgress() : p.progress)};
      if(withStats) o.stats = statsSanitize(p.stats);
      return o;
    })};
}
// profiles read from a code, cleaned; anything unusable is dropped
function codeProfiles(data){
  return data.profiles.slice(0, 50).filter(x=>x && typeof x==='object').map(x=>({
    id: (typeof x.id==='string' && /^[A-Za-z0-9_-]{1,40}$/.test(x.id)) ? x.id : newProfileId(),
    name: (typeof x.name==='string' ? x.name : '').trim().slice(0,20),
    gender: GENDER_INFO[x.gender] ? x.gender : 'n',
    progress: cleanProgress(x.progress),
    stats: (x.stats && typeof x.stats==='object') ? statsSanitize(x.stats) : null
  }));
}
// choices: {profileId: 'add'|'replace'|'new'|'skip'}. Works on a store object; returns {added, replaced, skipped} or {error}
function restoreInto(st, incoming, choices){
  const plan = [];
  let adds = 0;
  incoming.forEach(c=>{
    const exists = st.profiles.find(p=>p.id===c.id);
    let ch = choices[c.id] || (exists ? 'new' : 'add');
    if(!exists && (ch==='replace'||ch==='new')) ch = 'add';
    if(exists && ch==='add') ch = 'new';
    if(ch==='skip') plan.push({c, ch}); else { plan.push({c, ch, exists}); if(ch!=='replace') adds++; }
  });
  if(st.profiles.length + adds > MAX_PROFILES) return {error:'limit', limit:MAX_PROFILES};
  let added=0, replaced=0, skipped=0;
  plan.forEach(({c,ch,exists})=>{
    if(ch==='skip'){ skipped++; return; }
    if(ch==='replace'){ exists.name=c.name; exists.gender=c.gender; exists.progress=c.progress; if(c.stats) exists.stats=c.stats; exists.u=Date.now(); replaced++; return; }
    const id = (ch==='new') ? newProfileId() : c.id;
    st.profiles.push({id, name:c.name, gender:c.gender, progress:c.progress, stats:c.stats||statsNew(), u:Date.now(), sy:0}); added++;
  });
  return {added, replaced, skipped};
}

// ===== QUESTION MATRIX: which sections, difficulty levels and question types are shown (per profile, parent controls) =====
// Three layers, from coarse to fine. Each is optional; with nothing set the game behaves exactly as before.

// trend: separate from the assessment; latest window against the window before it
function trendSkill(stats, skill, cfg){
  cfg = cfg||STATS_CONFIG;
  const T = cfg.trend;
  const rec = statsSummarize(statsRecent(stats, skill, T.window, 0));
  const prev = statsSummarize(statsRecent(stats, skill, T.window, T.window));
  const ready = rec.n >= T.minPerWindow && prev.n >= T.minPerWindow;
  if(!ready) return {ready:false, dir:null, delta:null, recent:{n:rec.n, accuracy:rec.accuracy}, previous:{n:prev.n, accuracy:prev.accuracy}, ...T.insufficient};
  const delta = rec.accuracy - prev.accuracy;
  const dir = delta > T.flat ? 'up' : (delta < -T.flat ? 'down' : 'flat');
  return {ready:true, dir, delta, recent:{n:rec.n, accuracy:rec.accuracy}, previous:{n:prev.n, accuracy:prev.accuracy}, ...T.labels[dir]};
}
// everything ever answered for a skill (daily summaries + raw log)
function lifetimeSkill(stats, skill){
  let n=0,c=0,t=0;
  for(const m of Object.values(stats.daily)){ const e=m[skill]; if(e){ n+=e.n; c+=e.c; t+=e.t; } }
  for(const r of stats.log) if(r.s===skill){ n++; c+=r.c; t+=r.d; }
  return {n, correct:c, accuracy:n?c/n:null, avgSec:n?t/n:null};
}
function statsSkillIds(stats){
  const ids = new Set();
  for(const m of Object.values(stats.daily)) for(const k of Object.keys(m)) ids.add(k);
  for(const r of stats.log) ids.add(r.s);
  return [...ids];
}
// wrong numeric answers grouped by (chosen - correct), e.g. +1, -10: the "type of mistake" view
function numericErrorPatterns(stats, skill, k){
  const h = new Map(); let other=0;
  for(const r of stats.log){
    if(r.c || (skill && r.s!==skill)) continue;
    const x=Number(r.x), a=Number(r.a);
    if(r.x!==undefined && r.a!==undefined && r.x!=='' && r.a!=='' && Number.isFinite(x) && Number.isFinite(a)){ const d=x-a; h.set(d,(h.get(d)||0)+1); } else other++;
  }
  return {patterns:[...h.entries()].map(([diff,count])=>({diff,count})).sort((p,q)=>q.count-p.count).slice(0,k||5), other};
}

// Works on numbers only (that is all the log keeps), so it also labels history recorded before this existed.
const WRONG_LABELS = {
  off1:  'קרוב ב-1 (פספוס קטן)',
  off10: 'הפרש של עשרה או מאה (שגיאת עשרות)',
  swap:  'ספרות במקום הלא נכון (למשל 36 במקום 63)',
  sign:  'היפוך סימן (חיובי במקום שלילי)',
  dbl:   'כפול או חצי מהנכון',
  tens:  'האחדות נכונה והעשרות שגויות',
  ones:  'העשרות נכונות והאחדות שגויה',
  other: 'טעות אחרת'
};
function classifyWrong(x, a){
  if(x===''||a===''||x==null||a==null) return null;
  x = Number(x); a = Number(a);
  if(!Number.isFinite(x) || !Number.isFinite(a) || x===a) return null;
  const d = Math.abs(x-a), ix = Number.isInteger(x), ia = Number.isInteger(a);
  if(d===1) return 'off1';
  if(a!==0 && x===-a) return 'sign';
  if(d===10 || d===100) return 'off10';
  if(ix && ia && x>=10 && a>=10){
    const sx = String(x), sa = String(a);
    if(sx.length===sa.length && sx.split('').sort().join('')===sa.split('').sort().join('')) return 'swap';
  }
  if(a!==0 && x===-a) return 'sign';
  if(a!==0 && x!==0 && (x===2*a || a===2*x)) return 'dbl';
  if(ix && ia){
    if(d%10===0) return 'tens';
    if(Math.floor(x/10)===Math.floor(a/10)) return 'ones';
  }
  return 'other';
}
// counts per label for one skill (or all), numeric wrong answers only
function wrongLabelCounts(stats, skill){
  const c = {}; let n = 0;
  for(const r of stats.log){
    if(r.c || (skill && r.s!==skill) || r.x===undefined || r.a===undefined || r.x==='' || r.a==='') continue;
    const k = classifyWrong(r.x, r.a); if(!k) continue;
    c[k] = (c[k]||0)+1; n++;
  }
  const list = Object.keys(c).map(k=>({id:k, count:c[k]})).sort((p,q)=>q.count-p.count);
  return {n, list};
}
function statsActivity(stats){
  const days = {};
  for(const [day,m] of Object.entries(stats.daily)) for(const e of Object.values(m)){ const d=(days[day]=days[day]||{n:0,c:0}); d.n+=e.n; d.c+=e.c; }
  for(const r of stats.log){ const day=statsDateKey(r.t), d=(days[day]=days[day]||{n:0,c:0}); d.n++; d.c+=r.c; }
  const perDay = Object.keys(days).sort().map(day=>({day, n:days[day].n, correct:days[day].c}));
  return {daysPlayed:perDay.length, firstDay:perDay.length?perDay[0].day:null, lastDay:perDay.length?perDay[perDay.length-1].day:null,
          totalAnswers:perDay.reduce((t,d)=>t+d.n,0), perDay};
}
// the full picture, ready for any UI
function statsReport(stats, cfg){
  cfg = cfg||STATS_CONFIG;
  const skills = statsSkillIds(stats).map(id=>({...assessSkill(stats,id,cfg), lifetime:lifetimeSkill(stats,id), trend:trendSkill(stats,id,cfg)}));
  const areaIds = [...new Set(skills.map(s=>s.area))];
  const areas = areaIds.map(area=>{
    const recs = skills.filter(s=>s.area===area).flatMap(s=>statsRecent(stats, s.skill, cfg.window, 0));
    const w = statsSummarize(recs), ready = w.n>=cfg.minAnswers;
    return {area, name:cfg.areas[area]||area, n:w.n, accuracy:w.accuracy, medianSec:w.medianSec, ready,
            band: ready ? statsPoolBand(w.accuracy, cfg) : Object.assign({}, cfg.insufficient), skills:skills.filter(s=>s.area===area).map(s=>s.skill)};
  });
  const all = statsSummarize(skills.flatMap(s=>statsRecent(stats, s.skill, cfg.window, 0)));
  const readySkills = skills.filter(s=>s.ready);
  const byAcc = (a,b)=> (a.accuracy-b.accuracy) || (b.n-a.n);
  return {
    skills, areas,
    overall: {n:all.n, accuracy:all.accuracy, medianSec:all.medianSec, ready:all.n>=cfg.minAnswers, band: all.n>=cfg.minAnswers ? statsPoolBand(all.accuracy,cfg) : Object.assign({}, cfg.insufficient)},
    weakest: readySkills.slice().sort(byAcc).slice(0,cfg.listSize).map(s=>s.skill),
    strongest: readySkills.slice().sort((a,b)=>byAcc(b,a)).slice(0,cfg.listSize).map(s=>s.skill),
    activity: statsActivity(stats)
  };
}

function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function mcqFrom(answer, spread){
  const sp = Math.max(1, Math.round(spread));
  const ans = Math.round(answer);
  const set = new Set([ans]);
  while(set.size<4){ let d = ri(-sp,sp); if(d===0) d=1; let val = ans+d; if(val>=0) set.add(val); }
  return shuffle([...set]);
}

function gRemainder(){

  do{ T = ri(K+1, K*6); } while(T%K===0);

  const tpl = [
    `בחנות יש ${hl(T)} ${w}, ורוצים לארוז אותם שווה בשווה ב-${hl(K)} שקיות מתנה. כמה ${w} יישארו מחוץ לשקיות (השארית)?`,

  return {label:"בעיית שארית", text:pick(tpl), type:'mcq', answer: rem, choices: shuffle([...choices])};

  return {label:"ספירת עיגולים", text:`כמה מהצורות בשורה הבאה הן עיגולים (בכל צבע שהוא)?<br><span class="eq shapes">${row.join(' ')}</span>`,
    type:'mcq', answer: shapeFamCount, choices: mcqFrom(shapeFamCount,3)};
}

function pick(a){ return a[ri(0,a.length-1)]; }
function uniq(a){ return [...new Set(a)]; }
// Answer choices as objects {key, html} are drawn as pictures (grids etc.)
function gridChoice(key, html){ return {key, html}; }
function grid3HTML(cells, cs){
  return `<span class="g3" style="--cs:${cs}px">` + cells.map(c=>{
    if(!c) return '<i></i>';
    if(c===1) return '<i class="k"></i>';
    return `<i style="background:${c}"></i>`;
  }).join('') + `</span>`;
}
function choicesWith(ans, traps, spread){
  const s = new Set([ans]);
  shuffle(traps.slice()).forEach(t=>{ if(t>=0 && s.size<4) s.add(t); });
  let g=0; while(s.size<4 && g++<300){ const x = ans + ri(-spread,spread); if(x>=0) s.add(x); }

}

// 1) Pair analogy with trap options
const REL_BANK = [
  {pairs:[["ללעוס","שיניים"],["לראות","עיניים"],["לשמוע","אוזניים"],["להריח","אף"],["ללכת","רגליים"],["לטעום","לשון"]]},
  {pairs:[["חם","רותח"],["קר","קפוא"],["גדול","ענק"],["קטן","זעיר"],["עייף","מותש"]]},
  {pairs:[["חם","קר"],["גדול","קטן"],["יום","לילה"],["למעלה","למטה"],["מלא","ריק"],["מהיר","איטי"]]},
  {pairs:[["קן","ציפור"],["כוורת","דבורה"],["לול","תרנגולת"],["אורווה","סוס"],["מאורה","אריה"]]},
  {pairs:[["תפוח","פרי"],["כלב","חיה"],["ורד","פרח"],["כיסא","רהיט"],["גיטרה","כלי נגינה"]]},
  {pairs:[["גלגל","מכונית"],["דף","ספר"],["כנף","ציפור"],["אצבע","יד"],["חלון","בית"]]},
];
function gPairAnalogy(){
  const rel = pick(REL_BANK);
  const [p0,p1,p2] = shuffle(rel.pairs.slice());
  const fmt=(a,b)=>`${a} : ${b}`;
  const ans = fmt(p1[0],p1[1]);
  const trapPool = [fmt(p1[1],p1[0]), fmt(p1[0],p2[1]), fmt(p0[0],p1[1]), fmt(p1[0],p0[1]), fmt(p2[0],p1[1])];
  const set = new Set([ans]);
  shuffle(trapPool).forEach(t=>{ if(set.size<4 && t!==fmt(p0[0],p0[1])) set.add(t); });
  return {label:"היגיון: זוגות תואמים", text:`<span class="hl">${p0[0]} : ${p0[1]}</span><br>איזה זוג קשור זה לזה באותה דרך?`,
    type:'mcq', answer:ans, choices:shuffle([...set])};

// 2) Odd one out by a hidden property
const HIDDEN_PROPS = [

  {why:"שלושה הם יונקים, והדג לא", yes:["🐬","🐳","🦭","🐋"], no:["🐠","🦈","🐙"]},
  {why:"שלושה מטילים ביצים, והכלב לא", yes:["🐔","🐢","🐍","🦆","🐊"], no:["🐶","🐱","🐰","🐮"]},
  {why:"לשלושה יש שש רגליים, ולעכביש יש שמונה", yes:["🐜","🐝","🐞","🦋"], no:["🕷️"]},

function gHiddenOdd(){

// 3) Which grid doesn't belong
const sumG = g=>g.reduce((a,b)=>a+b,0);
const GRID_RULES = [
  {name:"הלוח סימטרי משמאל לימין", f:g=>[0,1,2].every(r=>g[r*3]===g[r*3+2])},
  {name:"הלוח סימטרי מלמעלה למטה", f:g=>[0,1,2].every(c=>g[c]===g[6+c])},
  {name:"כל הריבועים השחורים נמצאים בפינות", f:g=>g.every((x,i)=>!x||[0,2,6,8].includes(i)), corners:true},
];
// other visible symmetries: never allowed to split the four boards 2/2 (that would confuse the child)
const GRID_SYMS = [
  g=>g[1]===g[3]&&g[2]===g[6]&&g[5]===g[7],
  g=>g[1]===g[5]&&g[0]===g[8]&&g[3]===g[7],
  g=>[0,1,2,3].every(i=>g[i]===g[8-i]),
];
const GRID_EXTRA = [
  g=>sumG(g)%2===0, g=>g[4]===1, g=>[0,1,2].some(r=>g[r*3]&&g[r*3+1]&&g[r*3+2]),
  g=>[0,1,2].some(c=>g[c]&&g[3+c]&&g[6+c]),
  g=>g.every((x,i)=>!x||i!==4),
  ...[1,2,3,4,5,6].map(k=>g=>sumG(g)===k)
];
function randGrid(want, rule){
  for(let t=0;t<4000;t++){
    let g;
    if(want && rule.corners){ g=Array(9).fill(0); shuffle([0,2,6,8]).slice(0,ri(2,3)).forEach(i=>g[i]=1); }
    else g = Array.from({length:9},()=>Math.random()<0.45?1:0);
    const s=sumG(g); if(s<2||s>6) continue;
    if(rule.f(g)===want) return g;
  }
  return null;
}
function gOddGrid(){
  for(let attempt=0; attempt<1500; attempt++){
    const kk = ri(3,5);
    const R = pick([...GRID_RULES, {name:`בכל לוח יש בדיוק ${kk} ריבועים שחורים`, f:g=>sumG(g)===kk}, {name:"הריבוע האמצעי שחור", f:g=>g[4]===1}]);
    const goods=[], keys=new Set();
    let ok=true;
    while(goods.length<3){
      const g=randGrid(true,R); if(!g){ok=false;break;}
      const k=g.join(''); if(keys.has(k)) continue; keys.add(k); goods.push(g);
    }
    if(!ok) continue;
    const odd=randGrid(false,R); if(!odd||keys.has(odd.join(''))) continue;
    const all = shuffle([...goods.map(g=>({g,odd:false})), {g:odd,odd:true}]);
    const oddIdx = all.findIndex(x=>x.odd);
    // every other possible rule must not point at a different grid
    let clean=true;
    [...GRID_RULES.map(r=>r.f), ...GRID_SYMS].forEach(f=>{ if(all.filter(x=>f(x.g)).length===2) clean=false; });
    [...GRID_RULES.map(r=>r.f), ...GRID_SYMS, ...GRID_EXTRA].forEach(f=>{
      const vals = all.map(x=>f(x.g)); const t = vals.filter(Boolean).length;
      if(t===3){ if(vals.findIndex(v=>!v)!==oddIdx) clean=false; }
      else if(t===1){ if(vals.findIndex(v=>v)!==oddIdx) clean=false; }
    });
    if(!clean) continue;
    return {label:"היגיון: איזה לוח שונה?", text:`בשלושה מהלוחות יש חוק סודי, ואחד מהם שובר אותו. איזה לוח שובר את החוק?`,
      type:'mcq', answer:'g'+oddIdx, answerText:'הלוח המסומן בירוק',
      choices: all.map((x,i)=>gridChoice('g'+i, grid3HTML(x.g, 34))), explain:`החוק: ${R.name}.`};
  }
  return gOddGrid_fallback();
}
function gOddGrid_fallback(){ return gHiddenOdd(); }

// 4) A black square walking around the border of a 3x3 board
const BORDER = [0,1,2,5,8,7,6,3];
function oneBlack(pos){ const g=Array(9).fill(0); g[pos]=1; return g; }
function gMovingSquare(){
  const step = pick([1,1,2,3]), dir = pick([1,-1]), start = ri(0,7);
  const idx = k=>((start+dir*step*k)%8+8)%8;
  const seq = [0,1,2,3].map(k=>BORDER[idx(k)]);
  const ansIdx = idx(4), ans = BORDER[ansIdx];
  const cand = uniq([BORDER[(ansIdx+1)%8], BORDER[(ansIdx+7)%8], seq[3], 4, ...BORDER]).filter(p=>p!==ans);
  const first = uniq([BORDER[(ansIdx+1)%8], BORDER[(ansIdx+7)%8], seq[3]]).filter(p=>p!==ans);
  const wrong = uniq([...shuffle(first).slice(0,2), ...shuffle(cand)]).filter(p=>p!==ans).slice(0,3);
  const row = seq.map(p=>grid3HTML(oneBlack(p),24)).join('<span class="garrow">›</span>')
            + `<span class="garrow">›</span><span class="gq" style="--cs:24px">?</span>`;
  return {label:"היגיון: הריבוע ההולך", text:`הריבוע השחור זז לפי חוק קבוע. איפה הוא יהיה בלוח הבא?<div class="g3row">${row}</div>`,
    type:'mcq', answer:'p'+ans, answerText:'הלוח המסומן בירוק',
    choices: shuffle([ans,...wrong]).map(p=>gridChoice('p'+p, grid3HTML(oneBlack(p),34)))};
}

// 5) Two rules at once: how many AND which colour
function gTwoRules(){
  const fam = pick(SHAPE_FAMILIES);
  const cyc = shuffle([0,1,2,3,4,5]).slice(0,3).map(i=>fam[i]);
  const down = Math.random()<0.3;
  const count = k => down ? 5-k : 1+k;
  const groups = [0,1,2,3].map(k=>cyc[k%3].repeat(count(k)));
  const n = count(4), c = cyc[4%3];
  const others = cyc.filter(x=>x!==c);
  const wrongN = n===1 ? 2 : n-1;
  const opts = uniq([c.repeat(n), c.repeat(wrongN), others[0].repeat(n), others[1].repeat(n), c.repeat(n+1)]);
  const choices = shuffle([opts[0], opts[1], opts[2], opts[3]]);
  return {label:"היגיון: שני חוקים ביחד", text:`מה יופיע בשלב הבא?<br><span class="eq shapes">${groups.join(' , ')} , ?</span>`,
    type:'mcq', answer:c.repeat(n), choices};
}

// 6) Growing steps: the increase itself grows
function dotsStage(rows){ return `<span class="dstage">` + rows.map(n=>'●'.repeat(n)).join('<br>') + `</span>`; }
function gGrowingSteps(){
  const kind = pick(['tri','sq','diff','diff2']);
  if(kind==='tri' || kind==='sq'){
    const rowsOf = k => kind==='tri' ? Array.from({length:k},(_,i)=>i+1) : Array(k).fill(k);
    const val = k => kind==='tri' ? k*(k+1)/2 : k*k;
    const ans = val(5), lin = val(4)+(val(4)-val(3));
    const stages = [1,2,3,4].map(k=>dotsStage(rowsOf(k))).join('');
    return {label:"היגיון: צעדים שגדלים", text:`כמה נקודות יהיו בשלב החמישי?<div class="dstages">${stages}<span class="dstage">?</span></div>`,
      type:'mcq', answer:ans, choices:choicesWith(ans,[lin, ans-1, ans+1, val(4)+5],4)};
  }
  const s = ri(1,6), d0 = kind==='diff'? ri(1,2) : 2, inc = kind==='diff'? 1 : 2;
  const arr=[s]; for(let i=0;i<4;i++) arr.push(arr[i]+d0+inc*i);
  const ans = arr[4]+d0+inc*4, lin = arr[4]+(arr[4]-arr[3]);
  return {label:"היגיון: צעדים שגדלים", text:`מה המספר הבא?<br><span class="mono">${arr.join(' , ')} , __</span>`,
    type:'mcq', answer:ans, choices:choicesWith(ans,[lin, ans+1, ans-1],4)};
}

// 7) Conditional counting
function gCondCount(){
  if(Math.random()<0.5){
    for(;;){
      const pal=['🔴','🟦','🟡','🟢','🟥','🔵'];
      const row=Array.from({length:9},()=>pick(pal));
      const reds=row.filter(x=>x==='🔴').length, blues=row.filter(x=>x==='🟦').length;
      const ans=row.filter((x,i)=>x==='🔴'&&(row[i-1]==='🟦'||row[i+1]==='🟦')).length;
      if(reds<3||blues<2||ans<1||ans>4||ans===reds) continue;
      return {label:"היגיון: ספירה חכמה", text:`כמה 🔴 נמצאים ממש ליד 🟦 (מימין או משמאל)?<div class="srow">${row.map(x=>`<span>${x}</span>`).join('')}</div>`,
        type:'mcq', answer:ans, choices:choicesWith(ans,[reds,blues],2)};
    }
  }
  for(;;){
    const pal=['🔴','🟢','🔵','🟥','🟩','🟦'];
    const row=Array.from({length:12},()=>pick(pal));
    const ans=row.filter(x=>x==='🟩'||x==='🟦').length;
    const nonRed=row.filter(x=>x!=='🔴'&&x!=='🟥').length;
    const squares=row.filter(x=>'🟥🟩🟦'.includes(x)).length;
    if(ans<2||ans>5||nonRed===ans||squares===ans) continue;
    const line=a=>`<div class="srow">${a.map(x=>`<span>${x}</span>`).join('')}</div>`;
    return {label:"היגיון: ספירה חכמה", text:`כמה צורות הן לא עיגולים וגם לא אדומות?${line(row.slice(0,6))}${line(row.slice(6))}`,
      type:'mcq', answer:ans, choices:choicesWith(ans,[nonRed,squares],2)};
  }
}

// 8) Order four kids by height from mixed clues
function gHeightOrder(){
  const P = pickPeople(4);
  const perms=[]; (function rec(a,rest){ if(!rest.length){perms.push(a);return;} rest.forEach((x,i)=>rec([...a,x],rest.filter((_,j)=>j!==i))); })([],[0,1,2,3]);
  const pairs=[]; for(let i=0;i<4;i++) for(let j=i+1;j<4;j++) pairs.push([i,j]);
  for(let tries=0;tries<2000;tries++){
    const order=shuffle([0,1,2,3]); const rank=[]; order.forEach((p,r)=>rank[p]=r);
    const chosen=shuffle(pairs.slice()).slice(0,3);
    if(new Set(chosen.flat()).size<4) continue;
    const clues=chosen.map(([a,b])=>{ const [x,y]=Math.random()<0.5?[a,b]:[b,a]; return {x,y,xTaller:rank[x]<rank[y]}; });
    if(clues.every(c=>c.xTaller)||clues.every(c=>!c.xTaller)) continue;
    const askTall=Math.random()<0.5;
    const targets=new Set();
    perms.forEach(rk=>{ if(clues.every(c=>c.xTaller? rk[c.x]<rk[c.y] : rk[c.x]>rk[c.y])) targets.add(rk.indexOf(askTall?0:3)); });
    if(targets.size!==1) continue;
    const ansP=[...targets][0];
    const lines=clues.map(c=>`${P[c.x].n} ${v(P[c.x], c.xTaller?'גבוה':'נמוך', c.xTaller?'גבוהה':'נמוכה')} מ${P[c.y].n}.`).join('<br>');
    return {label:"היגיון: סדר גבהים", text:`${lines}<br>${askTall?'מי הכי גבוה/ה':'מי הכי נמוך/ה'} מבין הארבעה?`,
      type:'mcq', answer:P[ansP].n, choices:shuffle(P.map(p=>p.n))};
  }
  return gHiddenOdd();
}

// 9) Mini logic grid (regular: one attribute; bonus: two attributes, four clues)
const MG_PETS = ["כלב","חתול","ארנב","דג","תוכי","אוגר"];
const MG_FRUITS = ["תפוח","בננה","ענבים","תות","אבטיח"];
function logicGrid(twoAttr){
  const P = pickPeople(3);
  const pets = shuffle(MG_PETS.slice()).slice(0,3), fruits = shuffle(MG_FRUITS.slice()).slice(0,3);
  const perms3=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
  const sols = twoAttr ? perms3.flatMap(a=>perms3.map(b=>({pet:a,fr:b}))) : perms3.map(a=>({pet:a,fr:[0,1,2]}));
  const likes = p=>v(p,'אוהב','אוהבת');
  for(let round=0; round<60; round++){
    const truth = pick(sols);
    const cands=[];
    for(let i=0;i<3;i++){
      for(let k=0;k<3;k++){
        const hasP = truth.pet[i]===k;
        cands.push(hasP ? {t:`ה${pets[k]} אצל ${P[i].n}.`, f:s=>s.pet[i]===k}
                        : {t:`ל${P[i].n} אין ${pets[k]}.`, f:s=>s.pet[i]!==k});
        if(twoAttr){
          const hasF = truth.fr[i]===k;
          cands.push(hasF ? {t:`${P[i].n} ${likes(P[i])} ${fruits[k]}.`, f:s=>s.fr[i]===k}
                          : {t:`${P[i].n} לא ${likes(P[i])} ${fruits[k]}.`, f:s=>s.fr[i]!==k});
        }
      }
    }
    if(twoAttr){
      for(let a=0;a<3;a++) for(let b=0;b<3;b++){
        const pi = truth.pet.indexOf(a); const same = truth.fr[pi]===b;
        cands.push(same ? {t:`מי שיש לו ${pets[a]} אוהב ${fruits[b]}.`, f:s=>s.fr[s.pet.indexOf(a)]===b}
                        : {t:`מי שיש לו ${pets[a]} לא אוהב ${fruits[b]}.`, f:s=>s.fr[s.pet.indexOf(a)]!==b});
      }
    }
    const asked = ri(0,2);
    const nClues = twoAttr?4:3;
    for(let t=0;t<400;t++){
      const cl = shuffle(cands.slice()).slice(0,nClues);
      const ansOf = (set)=>{ const r=new Set(); sols.forEach(s=>{ if(set.every(c=>c.f(s))) r.add(twoAttr? s.fr[asked] : s.pet.indexOf(0)); }); return r; };
      // question: 1-attr -> who owns pets[0]; 2-attr -> which fruit does P[asked] like
      const full = ansOf(cl);
      if(full.size!==1) continue;
      let needed=true;
      for(let j=0;j<cl.length;j++){ if(ansOf(cl.filter((_,x)=>x!==j)).size===1){ needed=false; break; } }
      if(!needed) continue;
      const names = twoAttr ? fruits : P.map(p=>p.n);
      const ansIdx=[...full][0];
      const intro = twoAttr
        ? `${P[0].n}, ${P[1].n} ו${P[2].n}: לכל אחד מהשלושה יש חיה אחרת (${pets.join(', ')}) ופרי אהוב אחר (${fruits.join(', ')}).`
        : `${P[0].n}, ${P[1].n} ו${P[2].n}: לכל אחד מהשלושה יש חיה אחרת (${pets.join(', ')}).`;
      const q = twoAttr ? `איזה פרי ${likes(P[asked])} ${P[asked].n}?` : `למי יש ${pets[0]}?`;
      return {text:`${intro}<br>${cl.map(c=>c.t).join('<br>')}<br>${q}`,
        answer:names[ansIdx], choices:shuffle([...names, "אי אפשר לדעת"])};
    }
  }
  return null;
}
function gLogicGrid(){
  const r = logicGrid(false) || logicGrid(false);
  if(!r) return gHeightOrder();
  return {label:"היגיון: טבלת רמזים", type:'mcq', text:r.text, answer:r.answer, choices:r.choices};
}
function bLogicGrid2(){
  const r = logicGrid(true) || logicGrid(true);
  if(!r) return gHeightOrder();
  return {label:"בונוס היגיון: טבלת רמזים", type:'mcq', text:r.text, answer:r.answer, choices:r.choices};
}

// Bonus A: 3x3 matrix completion (two attributes: colour and shape)
const MX_COLORS = ['#e63946','#3a86ff','#2dc653','#f4b400','#9b5de5','#ff7a1a'];
const MX_SHAPES = ['●','■','▲','◆','★'];
function mxGlyph(color,shape,px){ return `<span class="gl" style="color:${color};font-size:${px}px">${shape}</span>`; }
function bLogicMatrix(){

  let ca,cb,sa,sb;
  do{ ca=pick([1,2]); cb=pick([1,2]); sa=pick([1,2]); sb=pick([1,2]); } while((((ca*sb-cb*sa)%3)+3)%3===0);
  const cell=(r,c)=>({c:(ca*r+cb*c)%3, s:(sa*r+sb*c)%3});
  const hr=ri(0,2), hc=ri(0,2); const T=cell(hr,hc);
  const cellsHTML=[]; for(let r=0;r<3;r++) for(let c=0;c<3;c++){
    if(r===hr&&c===hc) cellsHTML.push(`<div class="mxc q">?</div>`);

// Hand angles: minute hand = minutes*6 degrees, hour hand = (hour%12)*30 + minutes*0.5 degrees (so at 3:30 it sits between 3 and 4).
function clockSVG(h, m, size){
  size = size || 190;
  const R = 100, f = n => Math.round(n*100)/100;
  const ang = (h%12)*30 + m*0.5, mang = m*6;
  let s = `<svg class="clksvg" viewBox="0 0 200 200" width="${size}" height="${size}" data-time="${((h%12)||12)+':'+String(m).padStart(2,'0')}" data-ha="${f(ang)}" data-ma="${f(mang)}" role="img" aria-label="שעון">`;
  s += `<circle cx="100" cy="100" r="95" fill="#fff" stroke="#9b6bff" stroke-width="6"/>`;
  for(let i=0;i<60;i++){
    const a = i*6*Math.PI/180, big = i%5===0, r1 = big?83:88, r2 = 92;
    s += `<line x1="${f(R+r1*Math.sin(a))}" y1="${f(R-r1*Math.cos(a))}" x2="${f(R+r2*Math.sin(a))}" y2="${f(R-r2*Math.cos(a))}" stroke="#3b2a63" stroke-width="${big?3:1.4}" stroke-linecap="round"/>`;
  }
  for(let n=1;n<=12;n++){
    const a = n*30*Math.PI/180;
    s += `<text x="${f(R+68*Math.sin(a))}" y="${f(R-68*Math.cos(a)+7)}" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-size="21" font-weight="800" fill="#3b2a63">${n}</text>`;
  }
  s += `<line class="clk-h" x1="100" y1="108" x2="100" y2="55" stroke="#ff6fb0" stroke-width="8.5" stroke-linecap="round" transform="rotate(${f(ang)} 100 100)"/>`;
  s += `<line class="clk-m" x1="100" y1="110" x2="100" y2="24" stroke="#14a89a" stroke-width="5" stroke-linecap="round" transform="rotate(${f(mang)} 100 100)"/>`;
  s += `<circle cx="100" cy="100" r="6.5" fill="#3b2a63"/></svg>`;
  return `<span class="clk">${s}</span>`;
}
// times are handled as minutes after 12:00 (0..719)
const cT = (h,m) => (((h%12)*60+m)%720+720)%720;
const cNorm = t => ((t%720)+720)%720;
const cH = t => Math.floor(cNorm(t)/60), cM = t => cNorm(t)%60;

// Hebrew wording: 40 minutes and up are said as "N minutes to the next hour" (quarter to = "רבע ל-")
function timeWords(t){
  const h = Math.floor(cNorm(t)/60)||12, m = cM(t), nxt = (h%12)+1;
  if(m===0) return h+' בדיוק';

  if(m===30) return h+' וחצי';
  if(m===45) return 'רבע ל-'+nxt;
  if(m>=40) return (60-m)+' דקות ל-'+nxt;
  return h+' ו-'+m+' דקות';
}
function durWords(min){
  if(min<60){ if(min===15) return 'רבע שעה'; if(min===30) return 'חצי שעה'; return min+' דקות'; }
  const hr = Math.floor(min/60), r = min%60;
  const base = hr===1 ? 'שעה' : hr===2 ? 'שעתיים' : hr+' שעות';
  if(r===0) return base;

function cSwap(t){ const h=cH(t), m=cM(t); return m%5===0 ? cT(m/5, h*5) : -1; }   // the classic mix-up: reading the hands the other way round

  const rectDone = [seg(P1,P3), seg(P2,P3)], diag = [seg(P1,P2)];
  const P3off = Math.random()<0.5 ? [P3[0]-sx, P3[1]] : [P3[0], P3[1]-sy];            // a slanted, wrong corner (always inside the grid)
  const slant = [seg(P1,P3off), seg(P3off,P2)];
  const open = [seg(P1,P3)];
  const target = kind==='triangle' ? diag : rectDone;
  const wrongs = kind==='triangle' ? [rectDone, open, slant] : [diag, open, slant];
  const opts = shuffle([{k:'ok', e:target}, ...wrongs.map((e,i)=>({k:'w'+i, e}))]);
  const noun = kind==='rect' ? 'למלבן' : kind==='square' ? 'לריבוע' : 'למשולש';
  return {label:'משלימים צורה', text:`<div class="geoq">${gridCompleteSVG(a,b,sx,sy,c0,r0,null,140)}</div>משלימים את הצורה ${noun}. איזה ציור מראה את הצורה השלמה? (הקווים הוורודים הם התוספת)`,
    type:'mcq', answer:'ok', choices:opts.map(o=>gridChoice(o.k, gridCompleteSVG(a,b,sx,sy,c0,r0,o.e,104)))};
}

// ---- SHAPES GARDEN (גן הצורות): drawings. Text always uses currentColor (readable in light and dark), fills are light so nothing is written inside a shape. ----
const GEO_VB = '-30 -6 260 200';
function geoText(x, y, t, sz){ return `<text x="${f1(x)}" y="${f1(y)}" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-size="${sz||14}" font-weight="800" fill="currentColor">${t}</text>`; }
function geoPoly(pts){ return `<polygon points="${pts.map(p=>f1(p[0])+','+f1(p[1])).join(' ')}" fill="#cfe3ff" stroke="#8b5cf6" stroke-width="3" stroke-linejoin="round"/>`; }
function geoDash(x1,y1,x2,y2){ return `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="#ff6fb0" stroke-width="3.4" stroke-dasharray="7 5" stroke-linecap="round"/>`; }
function geoSVG(inner, label, w, vb){ return `<svg class="geosvg" viewBox="${vb||GEO_VB}" width="${w||230}" role="img" aria-label="${label||'צורה'}">${inner}</svg>`; }
// a named shape, centred in the drawing frame (100,92)
function shapePts(kind){
  const cx = 100, cy = 92;
  if(kind==='rect'){ const w = ri(120,150), h = ri(60,78); return [[cx-w/2,cy-h/2],[cx+w/2,cy-h/2],[cx+w/2,cy+h/2],[cx-w/2,cy+h/2]]; }
  if(kind==='square'){ const s = ri(82,100); return [[cx-s/2,cy-s/2],[cx+s/2,cy-s/2],[cx+s/2,cy+s/2],[cx-s/2,cy+s/2]]; }
  if(kind==='para'){ const w = ri(104,124), h = ri(60,74), sh = ri(24,32); return [[cx-w/2+sh,cy-h/2],[cx+w/2+sh,cy-h/2],[cx+w/2-sh,cy+h/2],[cx-w/2-sh,cy+h/2]]; }
  if(kind==='trap'){ const w1 = ri(50,66), w2 = ri(120,140), h = ri(64,78); return [[cx-w1/2,cy-h/2],[cx+w1/2,cy-h/2],[cx+w2/2,cy+h/2],[cx-w2/2,cy+h/2]]; }
  if(kind==='rhomb'){ const w = ri(124,142), h = ri(80,94); return [[cx,cy-h/2],[cx+w/2,cy],[cx,cy+h/2],[cx-w/2,cy]]; }
  if(kind==='tri'){ const h = ri(100,118), bw = ri(110,140), off = ri(-18,18); return [[cx+off,cy-h/2],[cx+bw/2,cy+h/2],[cx-bw/2,cy+h/2]]; }
  return polyPts(5);   // 'penta'
}
function gShapeSides(){
  const n = pick([3,4,5,6,8]);
  if(Math.random()<0.65){
    const corners = Math.random()<0.5;
    return {label:'כמה צלעות?', text:`<div class="geoq">${polySVG(polyPts(n),{dots:corners})}</div>כמה ${corners?'פינות':'צלעות'} יש לצורה?`, type:'mcq', answer:n, choices:mcq4(n,[n-1,n+1,n+2,n-2],2)};
  }
  const others = shuffle([3,4,5,6,8].filter(k=>k!==n)).slice(0,3);
  const opts = shuffle([n,...others]).map(k=>({k, svg:polySVG(polyPts(k),{w:104})}));
  const corners = Math.random()<0.5;
  return {label:'כמה צלעות?', text:`איזו צורה יש לה ${n} ${corners?'פינות':'צלעות'}?`, type:'mcq', answer:'k'+n, choices:opts.map(o=>gridChoice('k'+o.k, o.svg))};
}
function gWhichShape(){
  const target = pick(['rect','tri','square']), noun = {rect:'מלבן', tri:'משולש', square:'ריבוע'}[target];
  const pool = {rect:['para','trap','rhomb','tri','penta'], tri:['rect','para','trap','penta','square'], square:['rect','para','trap','rhomb']}[target];
  const kinds = shuffle([target, ...shuffle(pool.slice()).slice(0,3)]);
  return {label:'איזו צורה?', text:`איזו מהצורות היא ${noun}?`, type:'mcq', answer:'s'+target, choices:kinds.map(k=>gridChoice('s'+k, polySVG(shapePts(k),{w:104})))};
}
function cellsSVG(cells, cols, rows, cs, w){
  const pad = 4;
  let s = '';
  cells.forEach(([c,r])=>{ s += `<rect x="${pad+c*cs}" y="${pad+r*cs}" width="${cs}" height="${cs}" fill="#cfe3ff" stroke="#8b5cf6" stroke-width="1.8"/>`; });
  return geoSVG(s, 'ריבועים', w, `0 0 ${cols*cs+2*pad} ${rows*cs+2*pad}`);
}
function gCountSquares(){
  const kind = pick(['rect','stairs','L']), cells = [];
  let cols, rows, ans;
  if(kind==='rect'){ const a = ri(3,6), b = ri(2,4); cols=a; rows=b; for(let i=0;i<a;i++) for(let j=0;j<b;j++) cells.push([i,j]); }
  else if(kind==='stairs'){ const k = ri(3,5); cols=k; rows=k; for(let i=0;i<k;i++) for(let j=k-1-i;j<k;j++) cells.push([i,j]); }
  else { const a = ri(4,6), b = ri(3,4), c = ri(1,a-2), d = ri(1,b-1); cols=a; rows=b; for(let i=0;i<a;i++) for(let j=0;j<b;j++) if(!(i>=a-c && j<d)) cells.push([i,j]); }
  ans = cells.length;
  return {label:'סופרים ריבועים', text:`<div class="geoq">${cellsSVG(cells,cols,rows,26,cols*26*0.9+10)}</div>כמה ריבועים קטנים יש בצורה?`, type:'mcq', answer:ans, choices:mcq4(ans,[ans+1,ans-1,cols+rows,cols*rows,ans+2,ans-2],3)};
}
// shapes that have exactly one axis of symmetry among the options

function lShapeSVG(W,H,w1,h1){
  const sc = 11, x0 = 100-W*sc/2, y0 = 88-H*sc/2, X = i => x0+i*sc, Y = j => y0+j*sc;

    + geoText(X(W/2), Y(0)-8, W+' ס״מ') + geoText(X(W)+26, Y(h1/2)+5, h1+' ס״מ')
    + geoText(X(w1/2), Y(H)+18, w1+' ס״מ') + geoText(X(0)-26, Y(H/2)+5, H+' ס״מ'), 'גן בצורת האות L');

function gLPerimeter(){
  const W = ri(6,10), H = ri(6,10), w1 = ri(2,W-3), h1 = ri(2,H-3), per = 2*(W+H);

function rectQSVG(l){

function gMissingSide(){
  const l = ri(3,12); let w; do{ w = ri(2,9); } while(w===l);
  const per = 2*(l+w), H = w*10, W = l*10, x0 = 100-W/2, y0 = 92-H/2;

  return {label:'צלע חסרה', text:`<div class="geoq">${svg}</div>היקף המלבן הוא <span class="hl">${per}</span> ס״מ. מה אורך הצלע המסומנת ב-?`, type:'mcq', answer:w,
    choices:digChoices(w,[per/2, per-l, per-2*l, l, w+1, w-1],1,60,3)};
}
function joinedSVG(a,b,c,d){
  const sc = 14, x0 = 100-(a+c)*sc/2, yb = 92+b*sc/2;
  const rect = (x,w,h) => `<rect x="${f1(x)}" y="${f1(yb-h*sc)}" width="${w*sc}" height="${h*sc}" fill="#cfe3ff" stroke="#8b5cf6" stroke-width="3" stroke-linejoin="round"/>`;
  return geoSVG(rect(x0,a,b)+rect(x0+a*sc,c,d)
    + geoText(x0+a*sc/2, yb+18, a+' ס״מ') + geoText(x0+a*sc+c*sc/2, yb+18, c+' ס״מ')
    + geoText(x0-26, yb-b*sc/2+5, b+' ס״מ') + geoText(x0+(a+c)*sc+26, yb-d*sc/2+5, d+' ס״מ'), 'שני מלבנים מחוברים');
}

function bL2_ThreeEquations(){
  const [s1,s2,s3] = pickSyms(3);
  const x=ri(2,12), y=ri(2,12), z=ri(2,12);
  const AB=x+y, BC=y+z, AC=x+z;
  const which = ri(0,2);
  const targets = [{sym:s1, val:x}, {sym:s2, val:y}, {sym:s3, val:z}];
  const t = targets[which];
  return {label:"בונוס: שלוש משוואות", text:`<span class="eq">${s1} + ${s2} = <span class="hl">${AB}</span></span><br><span class="eq">${s2} + ${s3} = <span class="hl">${BC}</span></span><br><span class="eq">${s1} + ${s3} = <span class="hl">${AC}</span></span><br>רמז: חברו את שלוש התוצאות וחלקו ב-2 כדי לקבל את סכום כל השלושה.<br>מה המספר של ${t.sym}?`,
    type:'mcq', answer: t.val, choices: mcqFrom(t.val,4)};
}
function gFourLinkChain(){
  const [s1,s2,s3,s4] = pickSyms(4);
  const trueStmt = `${s1} > ${s4}`;
  const distractors = [`${s4} > ${s1}`, `${s3} > ${s1}`, `${s4} > ${s2}`];
  const choices = shuffle([trueStmt, ...distractors]);
  return {label:"שרשרת של ארבעה", text:`ידוע: <span class="eq">${s1} > ${s2}</span><br>וגם: <span class="eq">${s2} > ${s3}</span><br>וגם: <span class="eq">${s3} > ${s4}</span><br>איזה משפט חייב להיות נכון?`,
    type:'mcq', answer: trueStmt, choices};
}
function bL3_TwoStepMachine(){
  const addK = ri(1,6), mulK = ri(2,3);
  const order = ri(0,1);
  const out = v => order===0 ? (v+addK)*mulK : v*mulK+addK;
  const [i1,i2,i3,q] = shuffle([1,2,3,4,5,6,7,8]).slice(0,4);   // all different
  const inputs = [i1,i2,i3];
  const rows = inputs.map(v=>`${v} ⟶ ${out(v)}`).join('<br>');
  return {label:"בונוס: מכונה כפולה", text:`למכונה הזו יש שני שלבים נסתרים! הנה דוגמאות:<br><span class="mono">${rows}</span><br>לפי אותו כלל, מה יוצא כאשר מכניסים ${q}?`,
    type:'mcq', answer: out(q), choices: mcqFrom(out(q), Math.max(6,out(q)/3))};
}
function bL4_WordToSymbol(){
  const [p1,p2] = pickPeople(2); const item = pickItem();
  const per = ri(3,9); const total = per*2;
  const [s1,s2] = pickSyms(2);
  const sum2 = per + ri(2,10);
  return {label:"בונוס: משימה כפולה", text:`שלב 1: ${p1.n} ו${p2.n} אספו יחד <span class="hl">${total}</span> ${item} וחילקו אותם שווה בשווה. כל אחד קיבל מספר מסוים.<br>שלב 2: ${s1} = המספר שקיבל כל אחד.<br><span class="eq">${s1} + ${s2} = <span class="hl">${sum2}</span></span><br>מה המספר של ${s2}?`,
    type:'mcq', answer: sum2-per, choices: mcqFrom(sum2-per,4)};
}
function bL4_SpotErrorSequence(){
  const start=ri(1,8), step=ri(2,6);
  const arr=[0,1,2,3,4].map(i=>start+i*step);
  const idx = ri(1,3);
  let wrongVal = arr[idx] + (Math.random()<0.5? 1:-1)*ri(1,3);
  if(wrongVal===arr[idx]) wrongVal += 2;
  const displayArr = arr.slice(); displayArr[idx]=wrongVal;
  const correctVal = arr[idx];
  const set = new Set([correctVal, wrongVal]);
  while(set.size<4){ let d=ri(-step*2,step*2); if(d===0) d=1; let val=correctVal+d; if(val>=0) set.add(val); }
  return {label:"בונוס: מצאו את הטעות", text:`אחד המספרים בסדרה הבאה לא מתאים לחוק שלה:<br><span class="eq">${displayArr.join(' , ')}</span><br>מה המספר שאמור להיות שם באמת?`,
    type:'mcq', answer: correctVal, choices: shuffle([...set])};
}

function onRoomTap(hit, e){

}
function onDrawerClick(e){

  if(t.dataset.host){ const h = t.dataset.host, i = h==='bed' ? -1 : space.things.findIndex(q=>q.u===h); RM.sel = h==='bed' ? {t:'item',id:'bed'} : i>=0 ? {t:'thing',i} : null; RM.pv = null; rmRedraw(); return renderDrawer(); }   // from a thing on furniture to the furniture itself

  if(t.dataset.prev){ const id = t.dataset.prev; RM.pv = {t:'lv', id, to:topLv(id)+1}; rmRedraw(); return renderDrawer(); }

function spaceInit(){

  const ptr = new Map(); let moved = false, last = null, pinch = 0, startHit = null;
  ov.addEventListener('pointerdown', e=>{ const v=e.target.closest('#rmView'); if(!v) return; v.setPointerCapture && v.setPointerCapture(e.pointerId); ptr.set(e.pointerId,[e.clientX,e.clientY]); moved=false; startHit=(e.target.closest('[data-hit]')||{dataset:{}}).dataset.hit||null; if(ptr.size===2){ const [a,b]=[...ptr.values()]; pinch=Math.hypot(a[0]-b[0],a[1]-b[1]); } last=[e.clientX,e.clientY]; });

    if(ptr.size===2){ const [a,b]=[...ptr.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(pinch){ const m=rmVB({clientX:(a[0]+b[0])/2,clientY:(a[1]+b[1])/2}); rmZoomAt(RM.k*d/pinch, m[0], m[1]); } pinch=d; moved=true; return; }
    const dx=e.clientX-old[0], dy=e.clientY-old[1]; if(!moved && Math.hypot(e.clientX-last[0],e.clientY-last[1])<8) return; moved=true; const s=rmVB(e)[2]; rmPan(dx*s, dy*s); });

function flushCelebs(){
  if(celebOpen) return;
  if(space.earned>=SPACE_UNLOCK && !space.unlocked && !gateOn){ startUnlockGate(); return; }
  while(celebQueue.length){
    const ev = celebQueue.shift();
    if(ev.type==='merge' && baseCount(ev.kind)>=MERGE_COST){ showReadyCeleb(ev.kind); return; }
  }
}

function doMerge(kind){
  const slots = allRewardsList().filter(r=>!r.merged && kOf(r.item)===kind).slice(0,MERGE_COST).map(r=>r.slot);   // where the gifts that are used up stand in the list
  const used = removeBase(kind, MERGE_COST);
  // an upgraded item remembers the combinations it was made from, and where they were in the list
  space.earned++;   // one token per upgrade
  golden.push((LAYERS[kind] ? kind+'#'+used.map(x=>comboOfItem(x)||LAYER_DEFAULT[kind]).join(',') : kind) + (slots.length===MERGE_COST ? '@'+slots.join(',') : ''));
  saveState(); renderRewards();
  const small = Array.from({length:MERGE_COST},(_,i)=>`<span>${itemHTML(used[i]||kind,false,32)}</span>`).join('');
  showCeleb(`<div class="cmerge" id="cmerge">${small}</div><div class="ctitle">${TX('mergingTitle','מתמזגים...')}</div>`, []);
  setTimeout(()=>{ const m=document.getElementById('cmerge'); if(m) m.classList.add('go'); }, 60);
  setTimeout(()=>{
    burstConfetti(24);
    const more = baseCount(kind)>=MERGE_COST;
    const btns = [];
    if(more) btns.push({label:TX('mergeMore', ()=>`✨ ${G('מזגי','מזג','מזגו')} עוד`), fn:()=>doMerge(kind)});
    btns.push({label:'סגירה', ghost:more, fn:closeCeleb});
    showCeleb(`<div class="cbig">${itemHTML(kind,true,110)}</div><div class="ctitle">${rewardName(kind,'up') ? `${G('קיבלת','קיבלת','קיבלתם')} שדרוג: ${esc(rewardName(kind,'up'))}!` : `${G('קיבלת','קיבלת','קיבלתם')} גרסה משודרגת!`}</div><div class="csub">${TX('gotUpSub','היא נשמרת בחדר המתנות.')}</div><div class="toknew" id="tokNew">${tokenHTML(tokenBalance(),34)} <b>+1</b> מטבע · ${tokenBalance()} בסך הכול</div>`, btns);
  }, 1050);
}
// ---- MEMORY VAULT: an upgraded item keeps the 10 rewards it was made from, for good (there is no un-merge) ----
// the 10 items inside an upgraded item: the remembered ones, or the fixed default look for an old upgraded item that did not remember
function goldItems(kind, g){
  const cs = (g!=null && goldCombos(g)) || [];
  return Array.from({length:MERGE_COST},(_,i)=> LAYERS[kind] ? kind+':'+(cs[i]||LAYER_DEFAULT[kind]) : kind);
}
// tap an upgraded item in the gift room: the 10 rewards inside it

}
function mergedTag(merged){ return merged ? '<span class="wardskt">✨</span>' : ''; }
// every individual reward the child ever received, still ordered by time received:
// the ten items inside each upgraded item (the ones it was merged from, in the order they were merged = the order received),
// then the rewards still sitting in the room (in the order they were received)
function allRewardsList(){
  const merged=[], taken=new Set();
  golden.forEach(g=>{ const k=kOf(g), sl=goldSlots(g); let ok = !!sl && sl.every(n=>!taken.has(n)); if(ok) sl.forEach(n=>taken.add(n));
    goldItems(k,g).forEach((x,i)=>merged.push({item:x,gold:g,merged:true,slot:ok?sl[i]:-1})); });
  // upgraded items without (usable) places come first, as before: they take the earliest free places
  let free=0; merged.forEach(m=>{ if(m.slot<0){ while(taken.has(free)) free++; m.slot=free; taken.add(free); } });
  const bySlot=new Map(merged.map(m=>[m.slot,m])), out=[]; let ci=0, n=merged.length+collection.length;
  for(let s=0;out.length<n;s++){ if(bySlot.has(s)) out.push(bySlot.get(s)); else if(ci<collection.length){ out.push({item:collection[ci],gold:null,merged:false,slot:s,ci}); ci++; } else break; }
  merged.forEach(m=>{ if(!out.includes(m)) out.push(m); });   // places beyond the end (e.g. after gifts were removed): at the end
  return out;
}
