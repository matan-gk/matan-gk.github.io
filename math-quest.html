// A group of identical-looking shapes (e.g. 4 circles) is one item: it must never be split across two lines.
const SHAPE_RUN = /(?:(?:[\u{1F534}\u{1F7E0}-\u{1F7EB}\u26AB\u26AA\u2B1B\u2B1C\u{1F9E1}\u{1F49B}\u{1F49A}\u{1F499}\u{1F49C}\u{1F90E}\u{1F5A4}\u{1F90D}]|\u2764)\uFE0F?){2,}/gu;
function grpShapes(h){ return String(h).replace(SHAPE_RUN, m=>'<span class="grp">'+m+'</span>'); }
function renderAnswerArea(q, onAnswer){
  const area = document.getElementById('answerArea');
  area.innerHTML = '';
  if(q.type==='mcq'){
    const grid = document.createElement('div'); grid.className='choices';
    q.choices.forEach(c=>{
      const btn=document.createElement('div'); btn.className='choice';
      if(c && typeof c==='object'){
        btn.classList.add('grid-choice'); btn.innerHTML=c.html; btn.dataset.key=c.key;
        btn.onclick=()=>onAnswer(c.key, btn, grid);
        grid.appendChild(btn); return;
      }
      btn.textContent=c;
      const str = String(c);
      const isHebrew = /[\u0590-\u05FF]/.test(str);
      const isPureNumber = /^-?\d+$/.test(str.trim());
      if(!isHebrew){
        btn.style.direction='ltr';
        if(!isPureNumber){
          btn.classList.add('emoji-choice');
          const len = [...str.replace(/\uFE0F/g,'')].length;
          if(len>=8) btn.style.fontSize='1.5rem';
          else if(len>=5) btn.style.fontSize='1.9rem';
          else if(len>=4) btn.style.fontSize='2.2rem';
          else if(len>=2) btn.style.fontSize='2.6rem';
          if(len>=2) btn.classList.add('nowrapchoice');
        }
      }
      btn.onclick=()=>onAnswer(c, btn, grid);
      grid.appendChild(btn);
    });
    area.appendChild(grid);
    // shape groups stay on one line: shrink the font until the whole group fits its button
    grid.querySelectorAll('.nowrapchoice').forEach(btn=>{
      const sp=document.createElement('span'); sp.style.display='inline-block'; sp.textContent=btn.textContent; btn.textContent=''; btn.appendChild(sp);
      btn.style.transition='none'; const cs=getComputedStyle(btn), room=btn.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-4;
      let fs=parseFloat(cs.fontSize), g=0;
      while(sp.getBoundingClientRect().width>room && fs>14 && g++<40){ fs-=1; btn.style.fontSize=fs+'px'; }
    });
  } else {
    const form = document.createElement('form');
    form.id='answerForm';
    form.innerHTML = `<input type="text" inputmode="numeric" pattern="-?[0-9]*" id="numAns" placeholder="${G('התשובה שלך','התשובה שלך','התשובה שלכם')}" autocomplete="off"><button type="submit" class="btn">${G('בדקי','בדוק','בדקו')} 🍬</button>`;
    area.appendChild(form);
    form.addEventListener('submit', e=>{
      e.preventDefault();
      const v = Number(document.getElementById('numAns').value);
      onAnswer(v, null, null);
    });
    setTimeout(()=>document.getElementById('numAns') && document.getElementById('numAns').focus(), 50);
  }
  return area;
}

// ---- answer logging (feeds the stats engine) ----
let qTimer = {start:Date.now(), hidden:0, hideAt:null};
function startQTimer(){ qTimer = {start:Date.now(), hidden:0, hideAt:document.hidden?Date.now():null}; }
document.addEventListener('visibilitychange', ()=>{       // time spent with the tab hidden does not count
  if(document.hidden) qTimer.hideAt = Date.now();
  else if(qTimer.hideAt){ qTimer.hidden += Date.now()-qTimer.hideAt; qTimer.hideAt = null; }
});
function logAnswer(ok, chosen){
  const p = activeProfile();
  if(!p || !current || !current.skill || current._logged) return;
  current._logged = true;
  try{
    if(!p.stats) p.stats = statsNew();
    const hidden = qTimer.hidden + (qTimer.hideAt ? Date.now()-qTimer.hideAt : 0);
    statsRecord(p.stats, {skill:current.skill, level, bonus:current.isBonus, ok, seconds:(Date.now()-qTimer.start-hidden)/1000,
                          chosen, correct:current.answer});
  }catch(e){}   // stats must never break the game
}
// from the browser console: cqStats() = report for the active profile; STATS_CONFIG can be edited live to try other thresholds
window.cqStats = ()=>{ const p=activeProfile(); return p ? statsReport(p.stats||statsNew()) : null; };

function nextQuestion(){
  peekClear();
  if(lastMood==='puzzled') setMood('happy');          // the wrong-answer reaction lasts until the next question
  const wasBonus = bonusActive;
  bonusActive = false;
  document.getElementById('card').classList.remove('bonus-mode');
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  let pool = poolFor(level);
  if(!pool.length){ renderLevels(); pool = poolFor(level); }          // safety: the section was emptied while it was open
  if(!pool.length) pool = filterByDifficultySet(pools[level], activeDifficultyIds());
  const pr = activeProfile();
  const warming = warmOn && sessionDraws < WARMUP.count; sessionDraws++;
  const gen = pickGenerator(pool, pr && pr.stats, focusOn, current && current.skill, undefined, warming);
  current = themeStory(gen()); current.skill = gen.name; current.d = questionDifficulty({d:current.d, skill:gen.name}); current.isBonus = false; startQTimer();
  document.getElementById('qlabel').textContent = current.label;
  document.getElementById('qtext').innerHTML = grpShapes(current.text);
  renderAnswerArea(current, checkAnswer);
  if(wasBonus) setTimeout(flushCelebs, 350);
}

function renderBonus(){
  bonusActive = true;
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('card').classList.add('bonus-mode');
  const pool = BONUS_POOLS[level] || BONUS_POOLS[5];   // bonus questions are always hard: the difficulty setting does not apply
  const gen = pool[ri(0,pool.length-1)];
  current = themeStory(gen()); current.skill = gen.name; current.d = questionDifficulty({d:current.d, skill:gen.name}); current.isBonus = true; startQTimer();
  document.getElementById('qlabel').innerHTML = `<span class="bonustag">${TX('bonusTag','🍭 שאלת בונוס')}</span> — אפשר גם לדלג!`;
  document.getElementById('qtext').innerHTML = grpShapes(current.text);
  const area = renderAnswerArea(current, checkAnswer);
  const skipBtn = document.createElement('button');
  skipBtn.type='button';
  skipBtn.id='bonusSkipBtn';

  skipBtn.textContent=G('דלגי','דלג','דלגו')+' על הבונוס';
  skipBtn.onclick = nextQuestion;
  area.appendChild(skipBtn);
}

function checkAnswer(val, btnEl, grid){
  const ok = val === current.answer;
  logAnswer(ok, val);
  const fb = document.getElementById('feedback');
  if(grid){
    [...grid.children].forEach(c=>{
      c.style.pointerEvents='none';
      if((c.dataset.key!==undefined? c.dataset.key===String(current.answer) : c.textContent == String(current.answer))) c.classList.add('correct');
      else if(c===btnEl) c.classList.add('wrong');
    });
  }
  if(bonusActive){
    const skipBtn = document.getElementById('bonusSkipBtn');
    if(skipBtn) skipBtn.style.display='none';
    if(ok){
      const got=[newItem(STICKERS[ri(0,STICKERS.length-1)]), newItem(STICKERS[ri(0,STICKERS.length-1)])];   // a bonus question is worth two regular rewards
      got.forEach(it=>{ collection.push(it); if(baseCount(kOf(it))%MERGE_COST===0) queueCeleb({type:'merge',kind:kOf(it)}); });
      renderStickerbook(); renderRewards();
      burstConfetti(20);
      peekMascot(got.map(it=>rewardGlyph(it,40)).join(''));
      fb.innerHTML = `וואו${childName()?', '+esc(childName()):''}! ${G('זכית','זכית','זכיתם')} ב-2 מתנות: ` + got.map(it=>{ const n=rewardName(it,'one'); return (n?esc(n)+' ':'')+rewardGlyph(it,26); }).join(' ') + ' 🎉';
      fb.className='feedback good';
    } else {
      fb.textContent = `הפעם לא, אבל אין דבר! התשובה הייתה ${current.answerText||current.answer}.${current.explain?' '+current.explain:''}`;
      fb.className='feedback bad';
      peekMascot('');
    }
    document.getElementById('nextBtn').style.display='block';
    saveState();
    return;
  }
  if(ok){
    score += 10 + streak*2; streak++;
    const sticker = newItem(STICKERS[ri(0,STICKERS.length-1)]);
    collection.push(sticker);
    if(baseCount(kOf(sticker))%MERGE_COST===0) queueCeleb({type:'merge',kind:kOf(sticker)});
    renderStickerbook();
    burstConfetti(10);
    peekMascot(rewardGlyph(sticker,46));
    const sname = rewardName(sticker,'one');
    fb.innerHTML = esc(praise() + `  ${G('קיבלת','קיבלת','קיבלתם')} `) + (sname ? esc(sname)+' '+rewardGlyph(sticker,24) : esc(kOf(sticker))) + esc(current.explain? ' — '+current.explain : '');
    fb.className='feedback good';
    let pool = moodPool().filter(m=>m!==lastMood);
    setMood(pool[ri(0,pool.length-1)]);
    if(streak>0 && streak%5===0) showMilestone();   // the party and bonus question go first; merge celebrations wait until the bonus is done
    else setTimeout(flushCelebs, 700);
  } else {
    streak = 0;
    fb.textContent = `כמעט${childName()?', '+childName():''}! התשובה הנכונה היא ${current.answerText||current.answer}.${current.explain?' '+current.explain:''} ${TX('tryAgain','ננסה עוד אחת קסומה!')}`;
    fb.className='feedback bad';
    const card = document.getElementById('card');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    if(skinImg('react','puzzled',null)) setMood('puzzled');
    peekMascot('');
  }
  document.getElementById('score').textContent = score;
  document.getElementById('streak').textContent = streak;
  document.getElementById('nextBtn').style.display='block';
  saveState();
}

// Activity calendar (month heatmap)
function renderActivityCalendar(stats){
  const C = STATS_CONFIG;
  const perDay = statsActivity(stats).perDay;
  const byDay = {}; perDay.forEach(d=>byDay[d.day]=d);
  const today = new Date();
  const year = today.getFullYear(), month = today.getMonth();
  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun, 1=Mon...
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const hebrewMonths = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  // Find max for color intensity
  let maxN = 1;
  for(let d=1; d<=daysInMonth; d++){
    const key = statsDateKey(new Date(year, month, d).getTime());
    const n = (byDay[key]||{n:0}).n;
    if(n > maxN) maxN = n;
  }
  // Color scale: 0=var(--card2), low=var(--good-light), med=var(--good), high=var(--purple)
  function dayColor(n){
    if(!n) return 'var(--card2)';
    const r = n/maxN;
    if(r < 0.25) return 'var(--good-light)';
    if(r < 0.5) return 'var(--good)';
    if(r < 0.75) return 'var(--purple-light)';
    return 'var(--purple)';
  }
  const cells = [];
  // Empty cells before 1st day (adjust for Hebrew: week starts Sunday=0)
  for(let i=0; i<firstDay; i++) cells.push(`<div class="sk-cal-day empty"></div>`);
  for(let d=1; d<=daysInMonth; d++){
    const key = statsDateKey(new Date(year, month, d).getTime());
    const dayData = byDay[key]||{n:0, c:0};
    const n = dayData.n;
    const isToday = d === today.getDate();
    const accuracy = dayData.n ? dayData.c/dayData.n : null;
    cells.push(`<div class="sk-cal-day${isToday?' today':''}" title="${d} ${hebrewMonths[month]}: ${n} תשובות${accuracy!=null?` · ${pctText(accuracy)} נכונות`:''}">
      <span class="sk-cal-num">${d}</span>
      <i style="background:${dayColor(n)}"></i>
    </div>`);
  }
  const grid = `<div class="sk-cal-grid">${cells.join('')}</div>`;
  const legend = `<div class="sk-cal-legend">
    <span>פחות פעיל</span>
    <i style="background:var(--good-light)"></i>
    <i style="background:var(--good)"></i>
    <i style="background:var(--purple-light)"></i>
    <i style="background:var(--purple)"></i>
    <span>יותר פעיל</span>
  </div>`;
  return `<h2 class="pa-h">📅 לוח פעילות – ${hebrewMonths[month]} ${year}</h2>${grid}${legend}`;
}

// Lifetime totals per skill (shown next to recent in skill detail)
function skDetail(sk, stats){
  const C = STATS_CONFIG, lt = sk.lifetime, tr = sk.trend;
  const rows = [];
  rows.push(`<div>${sk.ready ? `לפי ${sk.n} התשובות האחרונות: <b>${sk.correct}</b> נכונות (${pctText(sk.accuracy)}) · זמן חציוני ${secText(sk.medianSec)}` : `עד עכשיו ${sk.n} תשובות. צריך לפחות ${C.minAnswers} כדי לקבוע רמה.`}</div>`);
  rows.push(`<div><span class="m">בסך הכול:</span> ${lt.n} תשובות, ${pctText(lt.accuracy)} נכונות${lt.avgSec!=null?` · זמן ממוצע ${secText(lt.avgSec)}`:''}</div>`);
  rows.push(`<div><span class="m">מגמה:</span> ${tr.ready ? `${tr.emoji} ${tr.label} (${pctText(tr.previous.accuracy)} ← ${pctText(tr.recent.accuracy)})` : `אין עדיין מספיק נתונים (צריך ${C.trend.minPerWindow} תשובות בכל אחת משתי התקופות)`}</div>`);
  const ep = numericErrorPatterns(stats, sk.skill, 3);
  if(ep.patterns.length) rows.push(`<div><span class="m">טעויות מספריות נפוצות (טעות ביחס לנכון):</span> ${ep.patterns.map(p=>`<bdi dir="ltr">${p.diff>0?'+':'−'}${Math.abs(p.diff)} ×${p.count}</bdi>`).join(' · ')}</div>`);
  const wl = wrongLabelCounts(stats, sk.skill);
  if(wl.n>=3){
    const top = wl.list.filter(e=>e.id!=='other').slice(0,2).filter(e=>e.count>=2 && e.count/wl.n>=0.3);
    if(top.length) rows.push(`<div><span class="m">סוג הטעות הנפוץ:</span> ${top.map(e=>`${esc(WRONG_LABELS[e.id])} (${e.count} מתוך ${wl.n})`).join(' · ')}</div>`);
  }
  return `<div class="sk-det">${rows.join('')}</div>`;
}

// Per-level accuracy for a skill (shown in skill detail when expanded)
function skLevelAccuracy(stats, skill){
  const C = STATS_CONFIG;
  const levels = [1,2,3].map(lvl=>{
    const recs = statsRecent(stats, skill, 1000, 0).filter(r=>r.l===lvl);
    if(!recs.length) return null;
    const w = statsSummarize(recs);
    return {level:lvl, n:w.n, correct:w.correct, accuracy:w.accuracy, medianSec:w.medianSec};
  }).filter(x=>x);
  if(!levels.length) return '';
  const labels = {1:'קל',2:'בינוני',3:'קשה'};
  const rows = levels.map(l=>`<div class="sk-lvl-row"><span>${esc(labels[l.level])}</span>${skBar(l.accuracy, statsBand(l.accuracy, skill, C).id)}<span class="sk-pct">${pctText(l.accuracy)} (${l.correct}/${l.n})</span></div>`).join('');
  return `<div class="sk-lvl"><span class="m">לפי רמה:</span>${rows}</div>`;
}

// Patch skDetail to include per-level accuracy
function skDetailWithLevels(sk, stats){
  const base = skDetail(sk, stats);
  const lvl = skLevelAccuracy(stats, sk.skill);
  if(!lvl) return base;
  return base.replace('</div>', lvl + '</div>');
}

  // last 14 days

function dbgHash(s,seed=0){ let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed; for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); } h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return 4294967296*(2097151&h2)+(h1>>>0); }

// Ask for birth year, verify age >= 18. State is per-session (not saved), so closing the parent area resets it.
let adult = {ok:false, bad:false};
function adultCheck(year){
  const currentYear = new Date().getFullYear();
  const age = currentYear - year;
  return age >= 18 && year >= 1900 && year <= currentYear;
}
function openAdultCheck(){
  adult.ok = false; adult.bad = false;
  document.getElementById('adultOverlay').hidden = false;
  const input = document.getElementById('adultYear');
  if(input){ input.value = ''; input.max = new Date().getFullYear(); input.focus(); }
}
function closeAdultCheck(){
  document.getElementById('adultOverlay').hidden = true;
  adult.ok = false; adult.bad = false;
}
function submitAdultCheck(){
  const input = document.getElementById('adultYear');
  if(!input) return;
  const year = parseInt(input.value, 10);
  const errEl = document.getElementById('adultError');
  if(isNaN(year)){
    adult.bad = true;
    if(errEl) errEl.textContent = 'נא להקליד שנת לידה תקינה';
    return;
  }
  if(adultCheck(year)){
    adult.ok = true;
    adult.bad = false;
    if(errEl) errEl.textContent = '';
    // Hide overlay but KEEP adult.ok=true (closeAdultCheck resets it)
    document.getElementById('adultOverlay').hidden = true;
    // Open the parent area after successful verification
    openPanel('profiles');
  } else {
    adult.bad = true;
    if(errEl) errEl.textContent = 'הגישה לאזור הורים מותרת מגיל 18 ומעלה';
  }
}

    for(const k of kinds) for(let i=0;i<n;i++) collection.push(newItem(k));
    if(active){ saveState(); renderRewards(); }
    else { p.progress = Object.assign({}, cleanProgress(p.progress), {collection:collection.slice()}); p.u = Date.now(); persist(); cloudChanged(); }
  } finally { if(!active){ collection = sv.collection; golden = sv.golden; } }
}

function dbgGenerateActivity(){
  dbgSync();
  const p = store.profiles.find(x=>x.id===dbg.pid);
  if(!p){ dbg.actMsg='אין פרופיל'; return renderProfiles(); }
  const n = parseInt(document.getElementById('dbgActN').value, 10) || 300;
  const pct = Math.max(10, Math.min(95, parseInt(document.getElementById('dbgActPct').value, 10) || 75)) / 100;
  const days = Math.max(1, Math.min(30, parseInt(document.getElementById('dbgActDays').value, 10) || 14));

  if(!p.stats) p.stats = statsNew();
  const stats = p.stats;

  // Get all regular (non-bonus) skills
  const regularSkills = Object.keys(SKILL_META).filter(k=>!SKILL_META[k].bonus);
  if(!regularSkills.length){ dbg.actMsg='אין סוגי שאלות זמינים'; return renderProfiles(); }

  // Pick a focused set of skills so each gets enough answers for assessment + trend
  // Trend needs: window*2 = 60 answers per skill (30 recent + 30 previous), minAnswers = 8
  // Assessment needs: window = 30, minAnswers = 8
  const T = STATS_CONFIG.trend;
  const minForTrend = T.window * 2; // 60
  const minForAssess = STATS_CONFIG.window; // 30
  // Aim for trend data: each focus skill should get at least minForTrend answers
  const maxFocusSkills = Math.max(3, Math.floor(n / minForTrend));
  const targetSkills = Math.min(maxFocusSkills, 8);
  const shuffled = [...regularSkills].sort(()=>Math.random()-0.5);
  const focusSkills = shuffled.slice(0, targetSkills);

  const now = Date.now();
  const dayMs = 24*60*60*1000;
  const perDay = Math.ceil(n / days);
  let created = 0;

  for(let d=0; d<days && created<n; d++){
    const dayStart = now - (days-1-d)*dayMs + Math.floor(Math.random()*dayMs*0.8);
    const todayCount = Math.min(perDay + Math.floor(Math.random()*5)-2, n-created);
    for(let i=0; i<todayCount && created<n; i++){
      // Pick from focus skills (80%) or other skills (20%)
      const skill = Math.random() < 0.8 ? focusSkills[Math.floor(Math.random()*focusSkills.length)]
                                          : regularSkills[Math.floor(Math.random()*regularSkills.length)];
      const meta = SKILL_META[skill];
      const level = meta.levels ? meta.levels[Math.floor(Math.random()*meta.levels.length)].id : Math.floor(Math.random()*3)+1;
      const ok = Math.random() < pct;
      const seconds = 2 + Math.random() * 30;
      const t = dayStart + i * (1000 + Math.random()*5000);

      let chosen = undefined, correct = undefined;
      if(!ok){
        // Generate plausible wrong answer based on skill type
        const ans = typeof meta.answer === 'function' ? meta.answer() : 10;
        correct = String(ans);
        // Common error patterns
        const errType = Math.random();
        if(errType < 0.3) chosen = String(ans + (Math.random()<0.5?1:-1)*(Math.random()<0.5?1:10));
        else if(errType < 0.6) chosen = String(ans * 2);
        else if(errType < 0.8) chosen = String(Math.max(0, ans - 10));
        else chosen = String(ans + 5);
      }

      statsRecord(stats, {
        skill,
        level,
        bonus: false,
        ok,
        seconds,
        chosen,
        correct,
        t
      });
      created++;
    }
  }

  // Also add some bonus answers
  const bonusSkills = Object.keys(SKILL_META).filter(k=>SKILL_META[k].bonus);
  if(bonusSkills.length){
    const bonusCount = Math.floor(n * 0.1);
    for(let i=0; i<bonusCount; i++){
      const skill = bonusSkills[Math.floor(Math.random()*bonusSkills.length)];
      const level = 3;
      const ok = Math.random() < (pct * 0.6); // bonus is harder
      const seconds = 10 + Math.random() * 60;
      const t = now - Math.random()*days*dayMs;

      statsRecord(stats, {skill, level, bonus: true, ok, seconds, chosen:undefined, correct:undefined, t});
    }
  }

  // Compact stats (rolls old log entries into daily summaries)
  statsCompact(stats, STATS_CONFIG);

  p.u = Date.now();
  persist();
  cloudChanged();

  dbg.actMsg = `✓ נוצרו ${created} תשובות רגילות על פני ${days} ימים (${Math.round(pct*100)}% הצלחה) + בונוסים. מוקד: ${focusSkills.length} סוגים עיקריים (כל אחד מקבל ~${Math.floor(created*0.8/focusSkills.length)} תשובות – מספיק למגמה). הלשונית "התקדמות" עודכנה.`;
  renderProfiles();
}
function dbgSaveTokens(){
  dbgSync();
  const p = store.profiles.find(x=>x.id===dbg.pid);
  if(!p){ dbg.tokMsg='אין פרופיל'; return renderProfiles(); }
  const earnedInput = document.getElementById('dbgTokEarned');
  const spentInput = document.getElementById('dbgTokSpent');
  const earned = Math.max(0, parseInt(earnedInput?.value, 10) || 0);
  const spent = Math.max(0, parseInt(spentInput?.value, 10) || 0);
  // Ensure spent doesn't exceed earned (balance can't be negative)
  const finalSpent = Math.min(spent, earned);
  // Update the profile's progress space object
  if(!p.progress.space) p.progress.space = spaceClean({}, [], 0);
  p.progress.space.earned = earned;
  p.progress.space.spent = finalSpent;
  // If this is the active profile, update the global space variable too
  if(p.id === store.activeId){
    space.earned = earned;
    space.spent = finalSpent;
  }
  p.u = Date.now();
  persist();
  cloudChanged();
  // Clear the stored input values so next render uses actual profile values
  dbg.tokEarned = '';
  dbg.tokSpent = '';
  dbg.tokMsg = `✓ עודכנו אסימונים: הרוויח=${earned}, הוציא=${finalSpent}, מאזן=${earned-finalSpent}`;
  renderProfiles();
}

    store.gone = (store.gone||[]).filter(g=>g.id!==id).concat([{id, u:Date.now()}]); profSigs.delete(id);
    persist(); profMode.confirmDel=null; cloudChanged();
    if(wasActive) refreshAll(); else saveState();
    return renderProfiles();
  }
  if(act==='save'){
    const name = document.getElementById('pfName').value;
    const g = (document.querySelector('input[name=pfG]:checked')||{}).value;
    if(!g){ profMode.error='בחרו איך לפנות (בת, בן או ניטרלי)'; document.getElementById('pfErr').textContent = profMode.error; return; }
    if(profMode.editId){

      if(p.id===store.activeId){ curGender = g; saveState(); refreshAll(); } else persist();
      cloudChanged();
      profMode={view:'list',editId:null,first:false,confirmDel:null,error:''};
    } else {
      const first = !store.profiles.length;
      const np = makeProfile(name, g, {});
      store.profiles.push(np);
      if(first){ store.activeId = np.id; enterProfile(); persist(); refreshAll(); document.getElementById('profOverlay').hidden = true; return; }
      switchProfile(np.id);
      profMode={view:'list',editId:null,first:false,confirmDel:null,error:''};
    }
    return renderProfiles();
  }
}


// ===== ICON IMAGES: swap emoji for images wherever the page shows them =====
(function(){
  const names = Object.keys(EMOJI_ICON).sort((a,b)=>b.length-a.length);
  const IC_TEST = new RegExp('(?:'+names.join('|')+')');
  const IC_RE = new RegExp('('+names.join('|')+')️?','g');
  // the pictures are put on each icon through the element's own style (and one CSS variable for the lock), never through a stylesheet written by script:
  // the Claude app's viewer does not apply stylesheets a script adds, which left these icons blank there
  document.documentElement.style.setProperty('--ic-lock', 'url('+ICON_IMG.lock+')');
  const SKIP = 'script,style,textarea,input,option,svg,.ic';
  function iconText(n){
    const s = n.nodeValue; if(!IC_TEST.test(s)) return;
    const frag = document.createDocumentFragment(); let last = 0, m; IC_RE.lastIndex = 0;
    while((m = IC_RE.exec(s))){
      if(m.index>last) frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      const sp = document.createElement('span'); sp.className = 'ic ic-'+EMOJI_ICON[m[1]]; sp.style.backgroundImage = 'url('+ICON_IMG[EMOJI_ICON[m[1]]]+')'; sp.textContent = m[0]; frag.appendChild(sp);
      last = m.index + m[0].length;
    }
    if(last<s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    n.parentNode.replaceChild(frag, n);
  }
  function iconify(root){
    if(!root) return;
    if(root.nodeType===3){ const p=root.parentElement; if(p && !p.closest(SKIP)) iconText(root); return; }
    if(root.nodeType!==1 || root.closest(SKIP)) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>IC_TEST.test(n.nodeValue)&&!(n.parentElement&&n.parentElement.closest(SKIP))?1:2});
    const list = []; while(w.nextNode()) list.push(w.currentNode);
    list.forEach(iconText);
  }
  const mo = new MutationObserver(recs=>{
    recs.forEach(r=>{ if(r.type==='characterData') iconify(r.target); else r.addedNodes.forEach(iconify); });
    mo.takeRecords();                      // ignore the changes made here
  });
  iconify(document.body);
  mo.observe(document.body, {childList:true, subtree:true, characterData:true});
  window.iconify = iconify;
})();

const PWA = {supported:false, ready:false, waiting:null, deferred:null, persisted:null, checked:0};
function pwaStandalone(){ try{ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }catch(e){ return false; } }
function pwaIOS(){ const u = navigator.userAgent||''; return /iPad|iPhone|iPod/.test(u) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function pwaToast(){
  if(document.getElementById('pwaToast') || !PWA.waiting) return;
  const d = document.createElement('div'); d.id = 'pwaToast'; d.setAttribute('role','status');
  d.innerHTML = '<span>יש גרסה חדשה של המשחק</span><button type="button" id="pwaReload">טעינה מחדש</button><button type="button" id="pwaLater" aria-label="לא עכשיו">✕</button>';
  document.body.appendChild(d);
  document.getElementById('pwaReload').onclick = ()=>{ try{ saveState(); }catch(e){} PWA.waiting.postMessage({type:'SKIP_WAITING'}); };
  document.getElementById('pwaLater').onclick = ()=>d.remove();
}
function pwaInit(){
  try{
    if(!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); PWA.deferred = e; if(profTabIsBackup()) renderProfiles(); });
    window.addEventListener('appinstalled', ()=>{ PWA.deferred = null; if(profTabIsBackup()) renderProfiles(); });
    let reloading = false; navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(!reloading && PWA.waiting){ reloading = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js').then(reg=>{
      PWA.supported = true; PWA.ready = !!navigator.serviceWorker.controller;
      const watch = w=>w.addEventListener('statechange', ()=>{ if(w.state==='installed' && navigator.serviceWorker.controller){ PWA.waiting = w; pwaToast(); } if(w.state==='activated') PWA.ready = true; });
      if(reg.waiting && navigator.serviceWorker.controller){ PWA.waiting = reg.waiting; pwaToast(); }
      if(reg.installing) watch(reg.installing);
      reg.addEventListener('updatefound', ()=>reg.installing && watch(reg.installing));
      document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && Date.now()-PWA.checked > 3600000){ PWA.checked = Date.now(); reg.update().catch(()=>{}); } });
      if(profTabIsBackup()) renderProfiles();
    }).catch(()=>{});
    if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().then(ok=>{ PWA.persisted = !!ok; }).catch(()=>{}); }
  }catch(e){}
}
function profTabIsBackup(){ const o = document.getElementById('profOverlay'); return o && !o.hidden && profTab==='backup' && profMode.view==='list'; }
async function pwaInstall(){
  if(!PWA.deferred) return;
  try{ PWA.deferred.prompt(); await PWA.deferred.userChoice; }catch(e){}
  PWA.deferred = null; renderProfiles();
}
function renderPwaCard(){
  if(!PWA.supported && !pwaStandalone()) return '';
  const on = pwaStandalone();
  let h = `<section class="pa-card"><h2 class="pa-h">מסך הבית וגישה בלי אינטרנט</h2>`;
  h += on ? `<p class="pa-sub"><b>המשחק מותקן ופועל במסך מלא.</b></p>` : `<p class="pa-sub">הוספת המשחק למסך הבית נותנת לו סמל משלו, פותחת אותו במסך מלא בלי סרגל הדפדפן, ושומרת את ההתקדמות בצורה אמינה יותר, במיוחד באייפון ובאייפד.</p>`;
  if(!on){
    if(PWA.deferred) h += `<div class="pa-actions"><button type="button" class="pa-btn" data-pact="pwainstall">התקנה במסך הבית</button></div>`;
    else if(pwaIOS()) h += `<p class="pa-sub"><b>באייפון או באייפד (בספארי):</b> לוחצים על כפתור השיתוף (ריבוע עם חץ למעלה), בוחרים "הוספה למסך הבית" ואז "הוספה".</p>`;
    else h += `<p class="pa-sub">בכרום ובדפדפנים אחרים: בתפריט הדפדפן בוחרים "התקנה" או "הוספה למסך הבית".</p>`;
  }
  h += `<p class="pa-sub" style="margin-bottom:0">${PWA.ready ? 'המשחק שמור במכשיר ויעבוד גם בלי אינטרנט. הגיבוי בענן יתעדכן כשהחיבור יחזור.' : 'אחרי הכניסה הבאה למשחק, הוא יישמר במכשיר ויעבוד גם בלי אינטרנט.'}${PWA.persisted===true ? ' שמירת הנתונים בדפדפן מוגנת.' : ''}</p></section>`;
  return h;
}
